---
# Makes sure the admin user exists with passwordless sudo and its GitHub keys.
# On a new host, bootstrap once as its original user (-e ansible_user=<user>);
# afterwards Ansible connects as the admin user itself, and every task here is
# idempotent for it.
- name: Fetch the admin user's SSH keys from GitHub
  uri:
    url: "https://github.com/{{ admin_user_github }}.keys"
    return_content: true
  register: admin_user_keys
  check_mode: false # read-only GET; lets --check show the authorized_keys diff

- name: Refuse to create a key-only user without keys
  fail:
    msg: "https://github.com/{{ admin_user_github }}.keys returned no keys"
  when: admin_user_keys.content | trim | length == 0

- name: Create the admin user (password locked, key-only)
  user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password_lock: true
  register: admin_user_account

# Under --check the user above isn't really created on a host that lacks it, so
# the tasks that need it to exist are skipped there (only in that case).
- name: Note whether the admin user exists yet
  set_fact:
    admin_user_pending: "{{ ansible_check_mode and admin_user_account is changed }}"

- name: Admin user's .ssh directory
  file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  when: not admin_user_pending

# The keys live in the same marked block secure-ssh maintains for the
# connecting user (now this user), so a key revoked on GitHub drops out of the
# file. A file with no managed block (missing, or #2176's unmarked seed) is
# rewritten as that block once; after that only secure-ssh edits it.
- name: Read the admin user's authorized_keys
  slurp:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
  register: admin_user_authorized_keys
  failed_when: false
  check_mode: false # read-only
  when: not admin_user_pending

- name: Admin user's authorized_keys as a managed GitHub keys block
  copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    content: |
      # BEGIN ANSIBLE MANAGED GITHUB SSH KEYS
      {{ admin_user_keys.content | trim }}
      # END ANSIBLE MANAGED GITHUB SSH KEYS
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when:
    - not admin_user_pending
    - admin_user_authorized_keys.content is not defined
      or 'ANSIBLE MANAGED GITHUB SSH KEYS' not in (admin_user_authorized_keys.content | b64decode)

# Passwordless sudo, since the account has no password. visudo checks the file
# before it's installed, so a bad file can't break sudo.
- name: Passwordless sudo for the admin user
  copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
