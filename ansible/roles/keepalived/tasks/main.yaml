---
- name: "Fail if required variables are not set"
  fail:
    msg: "keepalived_vip_address or keepalived_auth_password is empty: run through task ansible:* (Doppler ansible/prd KEEPALIVED_HOUSE_PASSWORD)"
  when: keepalived_vip_address | length == 0 or keepalived_auth_password | length == 0

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  when: not (docker_unchecked | default(false))

- name: Create Keepalived Config Directory
  file:
    path: /etc/keepalived
    state: directory
    mode: "0755"

- name: Generate Keepalived Config from Template
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0600"
  diff: false # the rendered config contains auth_pass
  notify: restart keepalived service

- name: Generate systemd Service for Keepalived
  template:
    src: keepalived.service.j2
    dest: /etc/systemd/system/keepalived.service
    mode: "0644"
  register: keepalived_unit
  notify: restart keepalived service
