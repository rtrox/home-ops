keepalived_vip_address: ""
keepalived_interface: "{{ ansible_facts.default_ipv4.interface }}"
keepalived_virtual_router_id: 51
keepalived_state: MASTER
keepalived_priority: "{{ 100 if keepalived_state == 'MASTER' else 99 }}"
keepalived_auth_password: ""
# renovate: datasource=docker
keepalived_docker_image: "ghcr.io/rtrox/keepalived:2.3.1-r0@sha256:02e0545214bacffd6ae0b7d7ca20033f3682882286119f94d9b680aff9146f71"

# Give up the VIP when the local DNS server stops accepting connections, so
# the peer takes over. A TCP connect rather than a real lookup: it needs no
# upstream, so an internet outage can't make both hosts drop the VIP at once.
# (Wrong-but-up answers are caught by the blackbox DNS probe instead.)
keepalived_track_dns: true
keepalived_dns_check_port: 53
keepalived_dns_check_interval: 2 # seconds between checks
keepalived_dns_check_fall: 3 # consecutive failures before giving up the VIP
keepalived_dns_check_rise: 2 # consecutive successes before taking it back
