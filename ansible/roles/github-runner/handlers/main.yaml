---
- name: restart github-runner service
  ansible.builtin.systemd:
    name: github-runner
    state: restarted
    daemon_reload: true
  when:
    - not (docker_unchecked | default(false))
    - not (ansible_check_mode and github_runner_unit is changed)

- name: restart github-runner-firewall service
  ansible.builtin.systemd:
    name: github-runner-firewall
    state: restarted
    daemon_reload: true
  when:
    - not (docker_unchecked | default(false))
    - not (ansible_check_mode and github_runner_firewall_unit is changed)
