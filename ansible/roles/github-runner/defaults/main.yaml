---
# The official runner image, pinned by digest; Renovate bumps tag and digest together (.github/renovate/ansibleImages.json5).
# renovate: datasource=docker
github_runner_image: "ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300"

# The only repository the runner serves (the GitHub App is installed on it only).
github_runner_repo: rtrox/home-ops
# Labels the job's runs-on must list (see .github/workflows/terraform-plan.yaml).
github_runner_labels:
  - self-hosted
  - linux
  - x64
  - home-ops
  - tofu

# Per-job container limits. The VM has 4 cores and 8 GiB.
github_runner_memory: 6g
github_runner_cpus: "3"
github_runner_pids_limit: 2048
# Wall-clock cap per job container (the workflow's own timeout is shorter).
github_runner_max_runtime_seconds: 10800

# The job network. Its firewall rules (templates/github-runner-firewall.j2)
# let jobs reach DNS, the LAN hosts below, and HTTPS on the internet only.
github_runner_network: github-runner-jobs
github_runner_bridge: ghrunner0
github_runner_subnet: 10.254.254.0/24
# LAN hosts a plan needs. pve.rtrox.io's API: the proxmox stack plans through it.
# envoy-internal: auth.rtrox.io (pocket-id), for clusters/mini-services. The
# rule matches the address, so jobs can reach every app on that gateway, not
# only pocket-id.
github_runner_allowed_lan:
  - name: pve.rtrox.io API
    address: "{{ hostvars[groups['proxmox'][0]].address }}"
    port: 8006
  - name: mini envoy-internal (pocket-id)
    # At the move, change the site key to house, as for loki_lan_address.
    address: "{{ (lookup('file', inventory_dir + '/sites.yaml') | from_yaml).sites.apartment.loadbalancer_pools.mini.reserved['envoy-internal'].address }}"
    port: 443
