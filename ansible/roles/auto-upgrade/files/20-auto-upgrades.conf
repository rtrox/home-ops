// Managed by Ansible (roles/auto-upgrade).
// Enable "1" overrides Armbian's 02-armbian-periodic, which sets it to "0" and
// silently disables the whole daily apt job (no updates, no unattended-upgrades).
APT::Periodic::Enable "1";
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::Download-Upgradeable-Packages "1";
APT::Periodic::AutocleanInterval "7";
