---
# Opt-in per host (raspi_monitor_enabled: true in inventory.yaml). When it's
# disabled, stop and disable any existing unit so a host without a working OLED
# doesn't crash-loop on I2C errors. The unit file and I2C setup are left in
# place, so turning it back on is just flipping the variable.
- name: Install and run Raspi-Monitor
  ansible.builtin.include_tasks: install.yaml
  when: raspi_monitor_enabled | bool

- name: Check for an existing Raspi-Monitor unit
  ansible.builtin.stat:
    path: /etc/systemd/system/raspi-monitor.service
  register: raspi_monitor_unit
  when: not raspi_monitor_enabled | bool

- name: Stop and disable Raspi-Monitor
  ansible.builtin.systemd:
    name: raspi-monitor
    enabled: false
    state: stopped
  when:
    - not raspi_monitor_enabled | bool
    - raspi_monitor_unit.stat.exists
