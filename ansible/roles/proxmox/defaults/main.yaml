---
# Named admin account on the Proxmox host.
# inventory/group_vars/proxmox.yaml sets it to the default user (rtrox).
proxmox_admin_user: ""

# GitHub account whose public keys are authorised for the admin user.
proxmox_ssh_github_username: ""

# Hardening is a separate switch so a first bootstrap run (as root, with
# -e proxmox_ssh_harden=false) can create the admin user and prove key login
# works before password SSH is turned off.
proxmox_ssh_harden: true

# Service account for the Terraform stack (terraform/stacks/proxmox). Each API
# token is written to Doppler by the play; it is never printed or logged.
# Privilege separation is on, so a token gets only its own ACL's role:
#   terraform  Administrator, for applies (owner's laptop), in hosts-at-home/prd
#   ci-plan    PVEAuditor (read-only), for CI plan jobs, in hosts-at-home/ci,
#              under the same key name so the generated provider reads it as is
proxmox_terraform_user: terraform@pve
proxmox_terraform_doppler_secret: PVE_TERRAFORM_API_TOKEN
proxmox_doppler_project: hosts-at-home
proxmox_doppler_config: prd
proxmox_terraform_tokens:
  - id: terraform
    role: Administrator
    doppler_config: prd
  - id: ci-plan
    role: PVEAuditor
    doppler_config: ci

# Let's Encrypt account. Only root@pam can create it (see tasks/acme.yaml).
proxmox_acme_account_name: letsencrypt
proxmox_acme_directory: https://acme-v02.api.letsencrypt.org/directory
proxmox_acme_email_secret: PVE_ACME_EMAIL
