---
# This is a no-subscription (free) install: hide the "No valid subscription"
# popup. Package upgrades overwrite the patched JS, so an apt hook reapplies it.
- name: Install the subscription-popup patch script
  copy:
    src: pve-nag-patch.sh
    dest: /usr/local/sbin/pve-nag-patch
    owner: root
    group: root
    mode: "0755"

- name: Reapply the patch after apt runs
  copy:
    dest: /etc/apt/apt.conf.d/99-pve-nag-patch
    content: |
      DPkg::Post-Invoke { "/usr/local/sbin/pve-nag-patch || true"; };
    owner: root
    group: root
    mode: "0644"

- name: Check whether the popup is already patched
  command:
    argv:
      - grep
      - -q
      - "void({ //Ext.Msg.show"
      - /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  register: proxmox_nag_patched
  changed_when: false
  failed_when: proxmox_nag_patched.rc > 1
  check_mode: false # read-only

- name: Apply the patch now
  command: /usr/local/sbin/pve-nag-patch
  when: proxmox_nag_patched.rc == 1
  changed_when: true
