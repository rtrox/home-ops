---
# Service account for the Terraform stack (terraform/stacks/proxmox).
#
# Privilege separation is on, so each token needs its own ACL as well as the
# user. The apply token gets Administrator on purpose: a token that manages
# users and ACLs (Permissions.Modify) can grant itself anything, so a narrower
# role would not add real isolation there. CI's plan token gets PVEAuditor.
#
# A token's secret is only shown once, when it is created. So the secret goes
# straight into Doppler from this play (never printed or logged). If either the
# token or the Doppler secret is missing, the token is recreated, which makes
# this play safe to rerun and to use for rotation.
- name: List PVE users
  command: pveum user list --output-format json
  register: proxmox_tf_users
  changed_when: false
  check_mode: false # read-only

- name: Create the Terraform PVE user
  command: "pveum user add {{ proxmox_terraform_user }} --comment 'Terraform (managed by Ansible)'"
  when: (proxmox_tf_users.stdout | from_json | map(attribute='userid') | list) is not contains(proxmox_terraform_user)
  changed_when: true

# The user itself gets Administrator; each privilege-separated token is limited
# to its own ACL (terraform-token.yaml).
- name: Grant the Terraform user the Administrator role on /
  command: "pveum acl modify / --roles Administrator --users {{ proxmox_terraform_user }}"
  changed_when: false # idempotent upsert

- name: Terraform API tokens
  include_tasks: terraform-token.yaml
  loop: "{{ proxmox_terraform_tokens }}"
  loop_control:
    loop_var: proxmox_tf_token
    label: "{{ proxmox_tf_token.id }}"
