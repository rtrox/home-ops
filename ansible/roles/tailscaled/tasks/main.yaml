---
- name: Ensure required directories for Tailscale Daemon exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  with_items:
    - /var/lib/tailscale

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  when: not (docker_unchecked | default(false))

- name: Create systemd service for Tailscale Daemon
  template:
    src: tailscaled.service.j2
    dest: /etc/systemd/system/tailscaled.service
  register: tailscaled_unit
  notify: restart tailscaled service

- name: Enable and start the Tailscale Daemon service
  systemd:
    name: tailscaled
    enabled: true
    state: started
  when:
    - not (docker_unchecked | default(false))
    - not (ansible_check_mode and tailscaled_unit is changed)
