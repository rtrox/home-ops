---
# NetworkManager (Raspberry Pi OS) rewrites /etc/resolv.conf on every boot and
# DHCP renewal, pointing the host at the DHCP-provided resolver: the VIP, i.e.
# Blocky itself. NetworkManager has its own DHCP client and ignores
# dhclient.conf, so the dhclient step below doesn't stop it. dns=none leaves
# resolv.conf to us.
- name: System Resolvers - Check whether NetworkManager is running
  command: systemctl is-active NetworkManager
  register: blocky_networkmanager
  changed_when: false
  failed_when: false
  check_mode: false # read-only
  when: blocky_set_system_resolvers

- name: System Resolvers - Stop NetworkManager from managing /etc/resolv.conf
  copy:
    dest: /etc/NetworkManager/conf.d/90-ansible-dns-none.conf
    content: |
      # Managed by Ansible (roles/blocky). /etc/resolv.conf is managed by Ansible.
      [main]
      dns=none
    mode: "0644"
  when:
    - blocky_set_system_resolvers
    - blocky_networkmanager.stdout == "active"
  notify: reload NetworkManager config

- name: System Resolvers - Write Resolvers to /etc/resolv.conf
  template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"
    backup: true
  when: blocky_set_system_resolvers

- name: System Resolvers - Prevent DHCP from overwriting /etc/resolv.conf
  lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: "^#?supersede domain-name-servers"
    line: supersede domain-name-servers {{ blocky_system_resolvers | join(" ") }};
    state: present
    create: true
  notify: restart networking

- name: Check if Systemd-Resolved is active
  command: systemctl is-active systemd-resolved
  register: systemd_resolved_status
  failed_when: false
  changed_when: false

- name: Disable Stub Listener to free port 53
  lineinfile:
    path: /etc/systemd/resolved.conf
    line: DNSStubListener=no
    state: present
  when: systemd_resolved_status.stdout == "active"
  notify: restart systemd-resolved

- name: Ensure required directories for Blocky exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /etc/blocky

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Configure Blocky Home using template
  template:
    src: config.yaml.j2
    dest: /etc/blocky/config.yaml
    mode: "0644"
  diff: false # the rendered config contains the Valkey password
  notify: restart blocky service

- name: Create systemd service for Blocky
  template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
  notify: restart blocky service

- name: Enable and start the Blocky service
  systemd:
    name: blocky
    enabled: true
    state: started
    daemon_reload: yes
