---
# Shared cache for Blocky. Runs on every DNS host; Blocky on both hosts
# connects through the keepalived VIP, so whichever host holds the VIP serves
# the cache for both. Contents are disposable: no persistence, LRU eviction.
valkey_image: valkey/valkey:9
valkey_port: 6379
valkey_maxmemory: 64mb
# The official image runs as this uid/gid; it owns the config file so the
# password stays unreadable to other users.
valkey_uid: 999
# valkey_password comes from valkey_secrets.yaml.
