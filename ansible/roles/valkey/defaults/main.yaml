---
# Shared cache for Blocky. Runs on every DNS host, but at the house both Blockys
# use ns1's (inventory/group_vars/dns.yaml); ns2's is unused. Contents are disposable: no persistence, LRU eviction.
# renovate: datasource=docker
valkey_image: "valkey/valkey:9@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8"
valkey_port: 6379
valkey_maxmemory: 64mb
# The official image runs as this uid/gid; it owns the config file so the
# password stays unreadable to other users.
valkey_uid: 999
# valkey_password comes from Doppler (inventory/group_vars).
