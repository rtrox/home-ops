---
- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  when: not (docker_unchecked | default(false))

- name: Create systemd service for node-exporter
  template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
  register: node_exporter_unit
  notify: restart node-exporter service

- name: Enable and start the node-exporter service
  systemd:
    name: node-exporter
    enabled: true
    state: started
    daemon_reload: yes
  when:
    - not (docker_unchecked | default(false))
    - not (ansible_check_mode and node_exporter_unit is changed)
