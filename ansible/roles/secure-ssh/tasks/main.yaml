---
- name: Ensure .ssh directory exists
  file:
    path: "/home/{{ ansible_user }}/.ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Ensure manually defined SSH keys are up-to-date in authorized_keys
  blockinfile:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    marker: "# {mark} ANSIBLE MANAGED SSH KEYS"
    block: "{{ ssh_public_keys | join('\n') }}"
    create: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ssh_public_keys is defined and ssh_public_keys | length > 0

- name: Fetch GitHub SSH keys
  uri:
    url: "https://github.com/{{ ssh_github_username }}.keys"
    return_content: yes
  register: github_keys
  check_mode: false # read-only GET; needed so --check can diff authorized_keys
  when: ssh_get_public_keys_from_github and ssh_github_username | length > 0

- name: Ensure GitHub SSH keys are up-to-date in authorized_keys
  blockinfile:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    marker: "# {mark} ANSIBLE MANAGED GITHUB SSH KEYS"
    block: "{{ github_keys.content }}"
    create: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when:
    - github_keys is not skipped
    - github_keys.content | trim | length > 0

- name: Verify at least one SSH key is present
  shell: "grep -E -v '^(#|$)' /home/{{ ansible_user }}/.ssh/authorized_keys | wc -l"
  register: ssh_key_count
  changed_when: false
  check_mode: false # read-only

- name: Fail if no SSH keys were written
  fail:
    msg: "No SSH keys found in /home/{{ ansible_user }}/.ssh/authorized_keys. Not disabling password authentication!"
  when: ssh_key_count.stdout | int == 0

# Key-only SSH. A drop-in that sorts first wins over later drop-ins (e.g.
# cloud-init's 50-cloud-init.conf) and over sshd_config, since sshd keeps the
# first value it reads. The sshd_config lines are kept as well, for an image
# whose sshd_config doesn't include sshd_config.d. Every file is checked with
# `sshd -t` before it's written, and sshd is reloaded (Debian tests the config
# again before reloading), so a bad config can't stop sshd on a remote host.
- name: Key-only SSH drop-in
  copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible (roles/secure-ssh): key-only login.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH service

- name: Disable password authentication in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
    backup: yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH service

# Keyboard-interactive can still accept a password through PAM.
- name: Disable keyboard-interactive authentication in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?(KbdInteractiveAuthentication|ChallengeResponseAuthentication)"
    line: "KbdInteractiveAuthentication no"
    state: present
    backup: yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH service
