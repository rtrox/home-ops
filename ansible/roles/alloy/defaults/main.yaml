---
# Ships this host's in-RAM journal (roles/journald) to Loki on Mini, including
# Blocky's per-query JSON lines. Nothing is written to disk: Alloy reads the
# journal from /run, keeps its read positions on a tmpfs, and buffers unsent
# logs only in memory.
# renovate: datasource=docker
alloy_image: "grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189"
# The cluster's loki-lan Service (cluster-apps/base/loki/app/service-lan.yaml),
# which only accepts connections from the DNS hosts. The address comes from the
# inventory (loki_lan_address in inventory/group_vars/all.yaml); override this
# variable to point somewhere else.
alloy_loki_push_url: "http://{{ loki_lan_address }}:3100/loki/api/v1/push"
# On (re)start, ship at most this much journal history.
alloy_journal_max_age: 12h
# If Loki is unreachable: retry each batch with exponential backoff between
# these bounds, then drop it. Pending batches are held in memory only.
alloy_min_backoff: 500ms
alloy_max_backoff: 5m
alloy_max_backoff_retries: 10
# Alloy itself uses ~40MiB, but its ~530MiB binary is mmapped and counted as
# (reclaimable) page cache. 256m kept it pinned at the limit, so the kernel kept
# evicting and re-reading binary pages; leave room for them.
alloy_memory_limit: 512m
