---
- name: Common configuration for the Raspberry Pis
  # Pi-oriented roles (Armbian, Raspberry Pi, raspi-monitor, Docker). Proxmox
  # has its own playbook; the VMs get theirs in later migration items.
  hosts: pis
  become: true

  pre_tasks:
    - name: Set docker_users dynamically
      set_fact:
        docker_users:
          - "{{ ansible_user }}"

  roles:
    - role: admin-user
    - role: journald
    - role: armbian
    - role: raspberry-pi
    - role: auto-upgrade
    - role: secure-ssh
      vars:
        ssh_get_public_keys_from_github: true
        ssh_github_username: "rtrox"
    - role: geerlingguy.docker
      vars:
        docker_users: "{{ docker_users }}"
        # Container output goes to journald, which keeps it in RAM (roles/journald),
        # instead of json-file logs on disk. `docker logs` still works.
        docker_daemon_options:
          log-driver: journald
          log-opts:
            tag: !unsafe "{{.Name}}"
    - role: raspi-monitor
    - role: node-exporter

  tasks:
    - name: Ensure /etc/hosts has an entry for the hostname
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ inventory_hostname }}"
        state: present

    - name: Get current hostname
      shell: hostname
      register: current_hostname
      changed_when: false

    - name: Set hostname if it differs
      command: hostnamectl set-hostname "{{ inventory_hostname }}"
      when: current_hostname.stdout != inventory_hostname

    - name: Ensure system configuration
      block:
        - name: Ensure timezone is set to UTC
          timezone:
            name: Etc/UTC # canonical name; tzdata upgrades rewrite the "UTC" alias to this
        # - name: Ensure locale is set to US English
        #   command: localectl set-locale LANG=en_US.UTF-8
        #   changed_when: false

    - name: Install common packages
      apt:
        name:
          - htop
          - vim
          - dnsutils # Provides dig
          - whois
          - curl
          - wget
          - git
          - net-tools
          - tmux
          - unzip
          - python3-pip
        state: present
        update_cache: yes

- name: Configure DNS Server hosts
  hosts: dns
  become: true

  vars_files:
    - blocky_secrets.yaml
    - keepalived_secrets.yaml
    - valkey_secrets.yaml

  tasks:
    - name: Configure DNS-related services
      block:
        - name: Set up Valkey
          include_role:
            name: valkey
        - name: Set up Blocky
          include_role:
            name: blocky
        - name: Set up Alloy (ships the journal, incl. DNS query logs, to Loki)
          include_role:
            name: alloy
        - name: Set up Keepalived
          include_role:
            name: keepalived
        - name: Enable Tailscale
          include_role:
            name: tailscaled

- name: Configure  Avahi Hosts
  hosts: avahi
  become: true

  tasks:
    - name: Configure Avahi-related services
      block:
        - name: Set up VLANs
          include_role:
            name: vlans
        - name: Enable Avahi
          include_role:
            name: avahi
