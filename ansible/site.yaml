---
- name: Common configuration for the Raspberry Pis
  # Pi-oriented roles (Armbian, Raspberry Pi, raspi-monitor, Docker). Proxmox
  # has its own playbook; the VMs get theirs in later migration items.
  hosts: pis:!offline
  become: true

  pre_tasks:
    - name: Detect Docker (read-only; see tasks/docker-present.yaml)
      ansible.builtin.import_tasks: tasks/docker-present.yaml
    - name: Set docker_users dynamically
      set_fact:
        docker_users:
          - "{{ ansible_user }}"

  roles:
    - role: admin-user
    - role: journald
    - role: armbian
    - role: raspberry-pi
    - role: auto-upgrade
    - role: secure-ssh
      vars:
        ssh_get_public_keys_from_github: true
        ssh_github_username: "rtrox"
    - role: geerlingguy.docker
      when: not (docker_unchecked | default(false))
      vars:
        docker_users: "{{ docker_users }}"
        # Container output goes to journald, which keeps it in RAM (roles/journald),
        # instead of json-file logs on disk. `docker logs` still works.
        docker_daemon_options:
          log-driver: journald
          log-opts:
            tag: !unsafe "{{.Name}}"
    - role: raspi-monitor
    - role: node-exporter

  tasks:
    - name: Ensure /etc/hosts has an entry for the hostname
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ inventory_hostname }}"
        state: present

    - name: Get current hostname
      shell: hostname
      register: current_hostname
      changed_when: false

    - name: Set hostname if it differs
      command: hostnamectl set-hostname "{{ inventory_hostname }}"
      when: current_hostname.stdout != inventory_hostname

    - name: Ensure system configuration
      block:
        - name: Ensure timezone is set to UTC
          timezone:
            name: Etc/UTC # canonical name; tzdata upgrades rewrite the "UTC" alias to this
        # - name: Ensure locale is set to US English
        #   command: localectl set-locale LANG=en_US.UTF-8
        #   changed_when: false

    - name: Install common packages
      apt:
        name:
          - htop
          - vim
          - dnsutils # Provides dig
          - whois
          - curl
          - wget
          - git
          - net-tools
          - tmux
          - unzip
          - python3-pip
        state: present
        update_cache: yes

- name: Configure DNS Server hosts
  hosts: dns
  become: true

  vars_files:
    - blocky_secrets.yaml
    - keepalived_secrets.yaml
    - valkey_secrets.yaml

  pre_tasks:
    - name: Detect Docker (read-only; see tasks/docker-present.yaml)
      ansible.builtin.import_tasks: tasks/docker-present.yaml

  tasks:
    - name: Configure DNS-related services
      block:
        - name: Set up Valkey
          include_role:
            name: valkey
        - name: Set up Blocky
          include_role:
            name: blocky
        - name: Set up Alloy (ships the journal, incl. DNS query logs, to Loki)
          include_role:
            name: alloy
        - name: Set up Keepalived
          include_role:
            name: keepalived
        - name: Enable Tailscale
          include_role:
            name: tailscaled

# The apartment's first resolver, a Proxmox VM (Debian 13). Same roles as the
# Pis where they apply; the Pi-only ones (journald, armbian, raspberry-pi,
# raspi-monitor, keepalived) are left out. The `pis` common play doesn't cover
# the VMs, so this play gives dns-a1 what it needs itself.
- name: Configure the apartment DNS hosts
  hosts: dns_apartment:!offline
  become: true

  # TODO: dns-a1 reuses the house's Valkey password (valkey_secrets.yaml) until
  # the Doppler migration gives it its own. Blocky's per-host settings come
  # from inventory/group_vars/dns_apartment.yaml, so blocky_secrets.yaml (the
  # house router's address) is not loaded.
  vars_files:
    - valkey_secrets.yaml

  pre_tasks:
    - name: Detect Docker (read-only; see tasks/docker-present.yaml)
      ansible.builtin.import_tasks: tasks/docker-present.yaml

  roles:
    - role: admin-user
    - role: secure-ssh
      vars:
        ssh_get_public_keys_from_github: true
        ssh_github_username: "rtrox"
    - role: geerlingguy.docker
      when: not (docker_unchecked | default(false))
      vars:
        docker_users:
          - "{{ ansible_user }}"
        # Same as the Pis: container output goes to journald.
        docker_daemon_options:
          log-driver: journald
          log-opts:
            tag: !unsafe "{{.Name}}"
    - role: node-exporter
    - role: valkey
    - role: blocky
    # TODO: auto-upgrade is left out: it reboots at a fixed hour and dns-a1 is
    # the apartment's only resolver until dns-a2 exists. Add it then (with the
    # dns-peer-check) so the two never upgrade together.

  tasks:
    - name: Install qemu-guest-agent (Proxmox reads the VM's IPs and shuts it down cleanly through it)
      apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
      register: qemu_guest_agent_install

    # Debian's unit is static (udev starts it when the VM's virtio port shows
    # up), so it's started, not enabled.
    - name: Start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        state: started
      # In --check the package may only be simulated, so its unit doesn't exist yet.
      when: not (ansible_check_mode and qemu_guest_agent_install is changed)

    - name: Install common packages
      apt:
        name:
          - dnsutils # Provides dig
          - curl
          - htop
          - vim
        state: present

# The self-hosted CI runner, a Proxmox VM (Debian 13). It holds credentials to
# everything the PR plans read, so it gets no other workloads, and it never
# manages its own VM.
- name: Configure the CI runner
  hosts: runners:!offline
  become: true

  # TODO: auto-upgrade is left out for now. Add it once a reboot between jobs
  # is acceptable (the service restarts on boot, so a reboot only costs the
  # job in flight).
  pre_tasks:
    - name: Detect Docker (read-only; see tasks/docker-present.yaml)
      ansible.builtin.import_tasks: tasks/docker-present.yaml

  roles:
    - role: admin-user
    - role: secure-ssh
      vars:
        ssh_get_public_keys_from_github: true
        ssh_github_username: "rtrox"
    - role: geerlingguy.docker
      when: not (docker_unchecked | default(false))
      vars:
        docker_users:
          - "{{ ansible_user }}"
        docker_daemon_options:
          log-driver: journald
          log-opts:
            tag: !unsafe "{{.Name}}"
    - role: github-runner

  tasks:
    - name: Install qemu-guest-agent (Proxmox reads the VM's IPs and shuts it down cleanly through it)
      apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
      register: qemu_guest_agent_install

    # Debian's unit is static (udev starts it when the VM's virtio port shows
    # up), so it's started, not enabled.
    - name: Start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        state: started
      # In --check the package may only be simulated, so its unit doesn't exist yet.
      when: not (ansible_check_mode and qemu_guest_agent_install is changed)

- name: Configure  Avahi Hosts
  hosts: avahi:!offline
  become: true

  pre_tasks:
    - name: Detect Docker (read-only; see tasks/docker-present.yaml)
      ansible.builtin.import_tasks: tasks/docker-present.yaml

  tasks:
    - name: Configure Avahi-related services
      block:
        - name: Set up VLANs
          include_role:
            name: vlans
        - name: Enable Avahi
          include_role:
            name: avahi
