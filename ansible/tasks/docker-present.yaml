---
# Shared pre-task for every play that uses Docker. Read-only, so it runs in
# check mode too (check_mode: false).
#
# In --check on a host without Docker, the Docker role only *simulates* the
# install, so every later task that needs the docker service or group fails for
# a reason that isn't real. Rather than ignoring errors, those tasks are skipped
# with `when: not (docker_unchecked | default(false))`. docker_unchecked is true
# only in check mode on a host without Docker; on a real run (or a host that has
# Docker) it is false and nothing is skipped.
- name: Look for the Docker binary
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary
  check_mode: false

- name: Look for the docker group
  ansible.builtin.command: getent group docker
  register: docker_group
  changed_when: false
  failed_when: docker_group.rc not in [0, 2]
  check_mode: false

- name: Work out whether Docker is installed
  ansible.builtin.set_fact:
    docker_present: "{{ docker_binary.stat.exists and docker_group.rc == 0 }}"
    docker_unchecked: "{{ ansible_check_mode and not (docker_binary.stat.exists and docker_group.rc == 0) }}"

- name: Say what can't be checked yet
  ansible.builtin.debug:
    msg: >-
      Docker isn't installed yet: an apply would install it; tasks that depend
      on it can't be checked until then
  when: docker_unchecked
