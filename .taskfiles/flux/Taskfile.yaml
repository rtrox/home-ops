---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  FLUX_PATH: "{{.CLUSTER_DIR}}/flux/cluster"

env:
  # flate defaults to the newest Kubernetes; match the cluster so chart
  # capability checks behave as they do in production. Keep this in step with
  # kubernetes in clusters/mini/talos/topf.yaml and FLATE_KUBE_VERSION in
  # .github/workflows/flate-mini.yaml.
  FLATE_KUBE_VERSION: "1.36.4"

tasks:
  default-requires:
    internal: true
    requires: &default-requires
      vars:
        - &requires-cluster-name
          name: CLUSTER_NAME
          enum: [bitty, mini]

  test:
    desc: Validate all Flux resources with flate (renders every HelmRelease)
    requires: *default-requires
    preconditions:
      - mise exec -- which flate
      - test -d "{{.FLUX_PATH}}"
    cmds:
      # --base= (empty) tests the whole tree rather than only what differs from
      # the default branch.
      - mise exec -- flate test --base= --path "{{.FLUX_PATH}}"

  test-quick:
    desc: Validate only the Flux Kustomizations, without rendering Helm charts (avoids registry rate limits)
    requires: *default-requires
    preconditions:
      - mise exec -- which flate
      - test -d "{{.FLUX_PATH}}"
    cmds:
      - mise exec -- flate test ks --base= --path "{{.FLUX_PATH}}"

  build:
    desc: Build Flux resources (Kustomizations or HelmReleases) [RESOURCE_TYPE=ks|hr, RESOURCE_NAME=optional]
    requires: *default-requires
    vars:
      RESOURCE_TYPE: '{{.RESOURCE_TYPE | default "ks"}}'
      RESOURCE_NAME: '{{.RESOURCE_NAME | default ""}}'
    preconditions:
      - mise exec -- which flate
      - test -d "{{.FLUX_PATH}}"
      - sh: test "{{.RESOURCE_TYPE}}" = "ks" -o "{{.RESOURCE_TYPE}}" = "hr"
        msg: "RESOURCE_TYPE must be 'ks' or 'hr'"
    cmds:
      - mise exec -- flate build {{.RESOURCE_TYPE}}
        {{if .RESOURCE_NAME}}{{.RESOURCE_NAME}}{{end}}
        --base=
        --path "{{.FLUX_PATH}}"

  list:
    desc: List Flux resources (Kustomizations or HelmReleases) [RESOURCE_TYPE=ks|hr]
    requires: *default-requires
    vars:
      RESOURCE_TYPE: '{{.RESOURCE_TYPE | default "ks"}}'
    preconditions:
      - mise exec -- which flate
      - test -d "{{.FLUX_PATH}}"
      - sh: test "{{.RESOURCE_TYPE}}" = "ks" -o "{{.RESOURCE_TYPE}}" = "hr"
        msg: "RESOURCE_TYPE must be 'ks' or 'hr'"
    cmds:
      - mise exec -- flate get {{.RESOURCE_TYPE}}
        --base=
        --path "{{.FLUX_PATH}}"

  diff:
    desc: Compare rendered Flux resources against a Git revision [RESOURCE_TYPE=all|ks|hr|images, BASE_BRANCH=main]
    requires: *default-requires
    vars:
      RESOURCE_TYPE: '{{.RESOURCE_TYPE | default "all"}}'
      BASE_BRANCH: '{{.BASE_BRANCH | default "main"}}'
    preconditions:
      - mise exec -- which flate
      - which git
      - test -d "{{.FLUX_PATH}}"
      - sh: test "{{.RESOURCE_TYPE}}" = "all" -o "{{.RESOURCE_TYPE}}" = "ks" -o "{{.RESOURCE_TYPE}}" = "hr" -o "{{.RESOURCE_TYPE}}" = "images"
        msg: "RESOURCE_TYPE must be 'all', 'ks', 'hr' or 'images'"
      - sh: git rev-parse --verify "{{.BASE_BRANCH}}" >/dev/null 2>&1
        msg: "Base branch '{{.BASE_BRANCH}}' does not exist"
    cmds:
      # flate compares against a Git revision directly, so no temporary worktree
      # is needed. It exits non-zero only on errors, not when there are changes.
      - mise exec -- flate diff {{.RESOURCE_TYPE}}
        --path "{{.FLUX_PATH}}"
        --base "{{.BASE_BRANCH}}"

  diff-all:
    desc: Compare all rendered Flux resources against a Git revision (alias for diff)
    requires: *default-requires
    vars:
      BASE_BRANCH: '{{.BASE_BRANCH | default "main"}}'
    cmds:
      - task: diff
        vars:
          RESOURCE_TYPE: "all"
          BASE_BRANCH: "{{.BASE_BRANCH}}"
