---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Talos machine config is managed with topf (https://github.com/postfinance/topf).
# Layout under clusters/<cluster>/talos/: topf.yaml, schematic*.yaml,
# secrets.sops.yaml, and patches in all/, control-plane/, worker/, node/<host>/.
# topf applies configs directly; Talos *upgrades* stay with tuppr
# (system-upgrade/tuppr), `upgrade-node` below is a manual break-glass only.

vars:
  TOPF_CONFIG: "{{.TALOS_DIR}}/topf.yaml"
  CLUSTERCONFIG_DIR: "{{.TALOS_DIR}}/clusterconfig"

tasks:
  default-requires:
    internal: true
    requires: &default-requires
      vars:
        - &requires-cluster-name
          name: CLUSTER_NAME
          enum: [bitty, mini]

  generate-clusterconfig:
    desc: Render node machine configs and the talosconfig (output is gitignored)
    requires: *default-requires
    preconditions:
      - which topf sops
      - test -f {{.TOPF_CONFIG}}
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
    cmds:
      - mkdir -p {{.CLUSTERCONFIG_DIR}}
      - topf --topfconfig {{.TOPF_CONFIG}} render --output {{.CLUSTERCONFIG_DIR}}
      - topf --topfconfig {{.TOPF_CONFIG}} talosconfig > {{.TALOSCONFIG}}

  validate-clusterconfig:
    desc: Render and validate every node config with talosctl (run before applying)
    requires: *default-requires
    preconditions:
      - which topf sops talosctl
    cmds:
      - task: generate-clusterconfig
      - |-
        for f in {{.CLUSTERCONFIG_DIR}}/node*.yaml; do
          talosctl validate --mode metal --config "$f" || exit 1
        done

  apply-clusterconfig:
    desc: Apply topf config to all nodes (DRY_RUN=true to preview; exits 2 if changes)
    requires: *default-requires
    preconditions:
      - which topf sops
      - test -f {{.TOPF_CONFIG}}
    cmds:
      - topf --topfconfig {{.TOPF_CONFIG}} apply
        {{ if eq "true" .DRY_RUN }}--dry-run{{ end }}

  apply-node:
    desc: Apply topf config to a single node [NODE=required, e.g. node01]
    requires:
      vars:
        - *requires-cluster-name
        - NODE
    preconditions:
      - which topf sops talosctl
      - test -f {{.TOPF_CONFIG}}
      - test -f "{{.TALOSCONFIG}}"
    cmds:
      - topf --topfconfig {{.TOPF_CONFIG}} --nodes-filter '^{{.NODE}}(\.|$)' apply
        {{ if eq "true" .DRY_RUN }}--dry-run{{ end }}
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.NODE}} health

  upgrade-node:
    desc: Break-glass Talos upgrade of one node [NODE=required]; normally tuppr does this
    requires:
      vars:
        - *requires-cluster-name
        - NODE
    preconditions:
      - which topf sops talosctl yq
      - test -f "{{.TALOSCONFIG}}"
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.NODE}} get machineconfig
    vars:
      FILE:
        sh: ls {{.CLUSTERCONFIG_DIR}}/{{.NODE}}.*.yaml
      # Talos < 1.14 keeps the installer image in .machine.install.image,
      # Talos >= 1.14 in the UnattendedInstallConfig document.
      TALOS_IMAGE:
        sh: yq eval-all 'select(.machine.install.image != null).machine.install.image, select(.kind == "UnattendedInstallConfig").installer.image' "{{.FILE}}" | grep -v '^null$' | head -1
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.NODE}} upgrade --image="{{.TALOS_IMAGE}}" --timeout=10m {{ if eq "true" .FORCE }}--force{{ end }}
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.NODE}} health
