---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# OpenTofu stacks under terraform/stacks/, orchestrated by Terramate. State
# lives in the R2 bucket tofu-state (see terraform/terramate.tm.hcl). The R2
# credentials and the state passphrase come from Doppler tf-at-home/prd, read
# per run into the environment and never written to disk. So do the provider
# credentials: each stack's generated _provider_env.json lists the environment
# variables it needs and the Doppler key each comes from (tf-at-home/prd or
# hosts-at-home/prd). Providers read them from the environment; no
# `data "doppler_secrets"` copies a whole config into state.
vars:
  TERRAFORM_DIR: "{{.ROOT_DIR}}/terraform"
  STACKS_DIR: "{{.TERRAFORM_DIR}}/stacks"
  DOPPLER_GET: doppler secrets get -p tf-at-home -c prd --plain

tasks:
  # Runs `tofu <CMD>` in one stack with the state credentials in its
  # environment. Kept internal so the Doppler reads only happen when a stack
  # command actually runs (not on `task --list`).
  _tofu:
    internal: true
    requires:
      vars: [STACK, CMD]
    dir: "{{.STACKS_DIR}}/{{.STACK}}"
    preconditions:
      - sh: test -f stack.tm.hcl
        msg: "{{.STACK}} is not a stack (no terraform/stacks/{{.STACK}}/stack.tm.hcl)"
      # *_override.tf is git-ignored (MIGRATION.md uses one temporarily), so a
      # forgotten one would silently change every later run.
      - sh: test -z "$(ls *_override.tf 2>/dev/null)" || test "{{.ALLOW_OVERRIDE}}" = true
        msg: "{{.STACK}} has an *_override.tf file; remove it (or pass ALLOW_OVERRIDE=true during a migration)"
      - sh: test -f _provider_env.json
        msg: "{{.STACK}} has no _provider_env.json (run: task tf:generate)"
      - sh: which jq doppler
        msg: "jq and doppler must be on PATH"
      - sh: test -n "$(doppler configure get token --plain)"
        msg: "doppler isn't logged in (run: doppler login)"
      # CI_KEYS (plan only): a test of what CI's read-only credentials see.
      - sh: test -z "{{.CI_KEYS}}" || test "{{.CMD}}" = plan
        msg: "CI_KEYS is for plans only (CI's read-only credentials must never apply)"
    env:
      AWS_ACCESS_KEY_ID:
        sh: "{{.DOPPLER_GET}} R2_STATE_READWRITE | jq -er .access_key_id"
      AWS_SECRET_ACCESS_KEY:
        sh: "{{.DOPPLER_GET}} R2_STATE_READWRITE | jq -er .secret_access_key"
      AWS_ENDPOINT_URL_S3:
        sh: "{{.DOPPLER_GET}} R2_STATE_READWRITE | jq -er .endpoint"
      # Stacks tagged laptop-only (stack.tm.hcl) encrypt their state with their
      # own passphrase, TOFU_STATE_PASSPHRASE_LAPTOP, which CI never holds: CI's
      # read-only R2 token reads every key in the bucket, and CI has
      # TOFU_STATE_PASSPHRASE. The tag is looked up with terramate, and every
      # failure (terramate, or a missing or empty key) stops the run: a
      # laptop-only stack never falls back to the shared passphrase.
      TF_VAR_state_passphrase:
        sh: |
          set -eu
          laptop=$(cd "{{.TERRAFORM_DIR}}" && mise exec -- terramate list --tags laptop-only) || {
            echo "task tf: terramate list --tags laptop-only failed; not choosing a state passphrase" >&2; exit 1; }
          if printf '%s\n' "$laptop" | grep -qxF "stacks/{{.STACK}}"; then
            p=$({{.DOPPLER_GET}} TOFU_STATE_PASSPHRASE_LAPTOP 2>/dev/null) || p=""
            if [ -z "$p" ]; then
              echo "task tf: {{.STACK}} is laptop-only and needs TOFU_STATE_PASSPHRASE_LAPTOP in tf-at-home/prd (see terraform/stacks/foundation/MIGRATION.md step 0). Not falling back to TOFU_STATE_PASSPHRASE." >&2
              exit 1
            fi
          else
            p=$({{.DOPPLER_GET}} TOFU_STATE_PASSPHRASE)
          fi
          printf '%s' "$p"
      # The generated provider "doppler" {} (stacks that write secrets) reads
      # DOPPLER_TOKEN. On the laptop that's the owner's CLI token, used
      # in-process only (nothing is uploaded anywhere, unlike Terraform Cloud's
      # remote runs). CI gets a scoped service token instead.
      DOPPLER_TOKEN:
        sh: doppler configure get token --plain
    cmd: |
      # Export this stack's provider credentials (name:project:key rows from
      # _provider_env.json). Values stay in this process's environment.
      rows=$(jq -r 'if type == "array" and all(.[]; (.env | type) == "string" and (.project | type) == "string" and (.key | type) == "string")
        then .[] | "\(.env):\(.project):\(.key)" else error end' _provider_env.json) || { echo "malformed _provider_env.json (run: task tf:generate)" >&2; exit 1; }
      # CI_KEYS="KEY ..." reads those Doppler keys from the ci config instead
      # of prd (plans only, see preconditions), e.g. CI_KEYS=TRUENAS_API_KEY to
      # see what CI's read-only TrueNAS key plans. Everything else stays prd.
      ci_keys=" {{.CI_KEYS}} "
      for row in $rows; do
        name=${row%%:*}; rest=${row#*:}; project=${rest%%:*}; key=${rest#*:}
        config=prd
        case "$ci_keys" in *" $key "*) config=ci; echo "task tf: $key from $project/ci" >&2 ;; esac
        value=$(doppler secrets get -p "$project" -c "$config" --plain "$key") || { echo "could not read $key from $project/$config" >&2; exit 1; }
        export "$name=$value"
      done
      {{if .PIPE}}set -o pipefail{{end}}
      mise exec -- tofu {{.CMD}} {{if ne .NO_CLI_ARGS "true"}}{{.CLI_ARGS}}{{end}}{{if .PIPE}} | {{.PIPE}}{{end}}

  generate:
    desc: Regenerate Terramate's generated files (_backend.tf, ...) in every stack
    dir: "{{.TERRAFORM_DIR}}"
    cmd: mise exec -- terramate generate

  list:
    desc: List the stacks, in run order
    dir: "{{.TERRAFORM_DIR}}"
    cmd: mise exec -- terramate list --run-order

  init:
    desc: Initialise a stack (STACK=proxmox; extra args after --, e.g. -- -upgrade)
    requires:
      vars: [STACK]
    cmds:
      - task: _tofu
        vars: { STACK: "{{.STACK}}", CMD: init, ALLOW_OVERRIDE: "{{.ALLOW_OVERRIDE}}" }

  plan:
    desc: Plan a stack (STACK=proxmox; CI_KEYS="KEY ..." reads those keys from the ci config, to test CI's read-only credentials)
    requires:
      vars: [STACK]
    cmds:
      # Pick up provider or lock-file changes first. -input=false: never prompts
      # (a backend migration needs an explicit `task tf:init -- -migrate-state`).
      - task: _tofu
        vars: { STACK: "{{.STACK}}", CMD: init -input=false, NO_CLI_ARGS: "true", CI_KEYS: "" }
      - task: _tofu
        vars: { STACK: "{{.STACK}}", CMD: plan, CI_KEYS: "{{.CI_KEYS}}" }

  apply:
    desc: Apply a stack (STACK=proxmox). The owner's step; agents are denied it.
    requires:
      vars: [STACK]
    cmds:
      # Pick up provider or lock-file changes first. -input=false: never prompts
      # (a backend migration needs an explicit `task tf:init -- -migrate-state`).
      - task: _tofu
        vars: { STACK: "{{.STACK}}", CMD: init -input=false, NO_CLI_ARGS: "true" }
      - task: _tofu
        vars: { STACK: "{{.STACK}}", CMD: apply }

  check-plan:
    desc: >-
      Check a saved plan against the changes expected of it
      (STACK=clusters/mini PLAN=<plan file> EXPECT=<json, relative to the stack>).
      Prints addresses and kinds only; fails on anything unexpected.
    requires:
      vars: [STACK, PLAN, EXPECT]
    preconditions:
      # tofu runs in the stack's directory, so a relative path would resolve
      # somewhere else than where it was written.
      - sh: case "{{.PLAN}}" in /*) exit 0 ;; *) exit 1 ;; esac
        msg: "PLAN must be an absolute path (got {{.PLAN}})"
      - sh: test -f "{{.PLAN}}"
        msg: "no plan file at {{.PLAN}}"
      - sh: test -f "{{.STACKS_DIR}}/{{.STACK}}/{{.EXPECT}}"
        msg: "no expectation file {{.EXPECT}} in terraform/stacks/{{.STACK}}"
    cmds:
      # `tofu show -json` of a plan holds every sensitive value in plain text,
      # so it only ever goes straight into the checker (terraform/scripts/
      # plan-check.jq), which prints addresses and kinds.
      - task: _tofu
        vars:
          STACK: "{{.STACK}}"
          CMD: show -json "{{.PLAN}}"
          NO_CLI_ARGS: "true"
          PIPE: jq -r --slurpfile expect "{{.EXPECT}}" -f "{{.TERRAFORM_DIR}}/scripts/plan-check.jq"
