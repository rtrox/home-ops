---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default-requires:
    internal: true
    requires: &default-requires
      vars:
        - APP
        - NAMESPACE

  restic-shell:
    desc: Open a shell with restic credentials for a Volsync backup in its environment
    requires: *default-requires
    vars:
      BACKEND: '{{.BACKEND | default "minio"}}'
    interactive: true
    preconditions:
      - which kubectl
      - sh: test "{{.BACKEND}}" = "minio" -o "{{.BACKEND}}" = "b2"
        msg: "BACKEND must be 'minio' or 'b2'"
      - sh: kubectl get secret "{{.APP}}-volsync-{{.BACKEND}}-secret" -n "{{.NAMESPACE}}" >/dev/null 2>&1
        msg: "Secret '{{.APP}}-volsync-{{.BACKEND}}-secret' not found in namespace '{{.NAMESPACE}}'"
    silent: true
    cmds:
      - |
        set -eu -o pipefail
        SECRET_NAME="{{.APP}}-volsync-{{.BACKEND}}-secret"
        get() { v="$(kubectl get secret "${SECRET_NAME}" -n "{{.NAMESPACE}}" -o "jsonpath={.data.$1}" | base64 -d)" && [ -n "$v" ] || { echo "volsync: $1 missing or unreadable in ${SECRET_NAME}" >&2; return 1; }; printf '%s' "$v"; }
        RESTIC_REPOSITORY="$(get RESTIC_REPOSITORY)"
        RESTIC_PASSWORD="$(get RESTIC_PASSWORD)"
        AWS_ACCESS_KEY_ID="$(get AWS_ACCESS_KEY_ID)"
        AWS_SECRET_ACCESS_KEY="$(get AWS_SECRET_ACCESS_KEY)"
        export RESTIC_REPOSITORY RESTIC_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        # Print only the host part of the repository, never a credential
        REPO_HOST="$(printf '%s' "${RESTIC_REPOSITORY}" | sed -E 's#^[a-z0-9]+:##; s#^[a-z0-9]+://##; s#^[^@/]*@##; s#/.*##')"
        echo "restic credentials loaded for repository host ${REPO_HOST}; type exit to leave"
        exec mise exec -- "${SHELL:-sh}"

  snapshots:
    desc: List restic snapshots for a Volsync backup
    requires: *default-requires
    vars:
      BACKEND: '{{.BACKEND | default "minio"}}'
    preconditions:
      - which kubectl
      - sh: mise exec -- restic version >/dev/null 2>&1
        msg: "restic not found: run mise install"
      - sh: test "{{.BACKEND}}" = "minio" -o "{{.BACKEND}}" = "b2"
        msg: "BACKEND must be 'minio' or 'b2'"
    cmds:
      - task: _with-restic-env
        vars:
          APP: "{{.APP}}"
          NAMESPACE: "{{.NAMESPACE}}"
          BACKEND: "{{.BACKEND}}"
          RESTIC_CMD: "restic snapshots"

  ls:
    desc: List files in the latest snapshot
    requires: *default-requires
    vars:
      BACKEND: '{{.BACKEND | default "minio"}}'
      SNAPSHOT: '{{.SNAPSHOT | default "latest"}}'
    preconditions:
      - which kubectl
      - sh: mise exec -- restic version >/dev/null 2>&1
        msg: "restic not found: run mise install"
    cmds:
      - task: _with-restic-env
        vars:
          APP: "{{.APP}}"
          NAMESPACE: "{{.NAMESPACE}}"
          BACKEND: "{{.BACKEND}}"
          RESTIC_CMD: "restic ls {{.SNAPSHOT}}"

  stats:
    desc: Show repository statistics
    requires: *default-requires
    vars:
      BACKEND: '{{.BACKEND | default "minio"}}'
    preconditions:
      - which kubectl
      - sh: mise exec -- restic version >/dev/null 2>&1
        msg: "restic not found: run mise install"
    cmds:
      - task: _with-restic-env
        vars:
          APP: "{{.APP}}"
          NAMESPACE: "{{.NAMESPACE}}"
          BACKEND: "{{.BACKEND}}"
          RESTIC_CMD: "restic stats"

  unlock:
    desc: Remove stale locks from the repository
    requires: *default-requires
    vars:
      BACKEND: '{{.BACKEND | default "minio"}}'
    preconditions:
      - which kubectl
      - sh: mise exec -- restic version >/dev/null 2>&1
        msg: "restic not found: run mise install"
    cmds:
      - task: _with-restic-env
        vars:
          APP: "{{.APP}}"
          NAMESPACE: "{{.NAMESPACE}}"
          BACKEND: "{{.BACKEND}}"
          RESTIC_CMD: "restic unlock"

  _with-restic-env:
    internal: true
    silent: true
    requires:
      vars:
        - APP
        - NAMESPACE
        - BACKEND
        - RESTIC_CMD
    cmds:
      - |
        set -eu -o pipefail
        SECRET_NAME="{{.APP}}-volsync-{{.BACKEND}}-secret"
        get() { v="$(kubectl get secret "${SECRET_NAME}" -n "{{.NAMESPACE}}" -o "jsonpath={.data.$1}" | base64 -d)" && [ -n "$v" ] || { echo "volsync: $1 missing or unreadable in ${SECRET_NAME}" >&2; return 1; }; printf '%s' "$v"; }
        RESTIC_REPOSITORY="$(get RESTIC_REPOSITORY)"
        RESTIC_PASSWORD="$(get RESTIC_PASSWORD)"
        AWS_ACCESS_KEY_ID="$(get AWS_ACCESS_KEY_ID)"
        AWS_SECRET_ACCESS_KEY="$(get AWS_SECRET_ACCESS_KEY)"
        export RESTIC_REPOSITORY RESTIC_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        mise exec -- {{.RESTIC_CMD}}
