---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ANSIBLE_DIR: "{{.ROOT_DIR}}/ansible"
  # --forks 1 applies to one host at a time, so a group target like `dns` never
  # restarts Docker (and drops DNS) on both name servers at once.
  ANSIBLE_ARGS: >-
    -i ../inventory/hosts.yaml
    --vault-password-file .ansible-vault-pass
    --forks 1

tasks:
  _preconditions:
    internal: true
    dir: "{{.ANSIBLE_DIR}}"
    preconditions:
      - sh: which ansible-playbook
        msg: "ansible-playbook not found on PATH"
      - sh: test -f ../inventory/group_vars/all.yaml
        msg: "inventory/group_vars/all.yaml is missing (local-only, see ansible/README.md)"
      - sh: test -f .ansible-vault-pass
        msg: "ansible/.ansible-vault-pass is missing (local-only, see ansible/README.md)"

  syntax:
    desc: Syntax-check the Ansible playbooks
    dir: "{{.ANSIBLE_DIR}}"
    deps: [_preconditions]
    cmds:
      - ansible-playbook {{.ANSIBLE_ARGS}} site.yaml --syntax-check
      - ansible-playbook {{.ANSIBLE_ARGS}} upgrade.yaml --syntax-check

  check:
    desc: Dry-run the playbook against a host or group, showing diffs (HOST=ns2.rtrox.io)
    dir: "{{.ANSIBLE_DIR}}"
    deps: [_preconditions]
    requires:
      vars: [HOST]
    cmd: ansible-playbook {{.ANSIBLE_ARGS}} site.yaml --limit {{.HOST}} --check --diff {{.CLI_ARGS}}

  apply:
    desc: Apply the playbook to a host or group (HOST=ns2.rtrox.io)
    dir: "{{.ANSIBLE_DIR}}"
    deps: [_preconditions]
    requires:
      vars: [HOST]
    cmd: ansible-playbook {{.ANSIBLE_ARGS}} site.yaml --limit {{.HOST}} {{.CLI_ARGS}}

  upgrade:
    desc: Upgrade OS packages and reboot, one host at a time (HOST=ns2.rtrox.io; add -- --check for a dry run)
    dir: "{{.ANSIBLE_DIR}}"
    deps: [_preconditions]
    requires:
      vars: [HOST]
    cmd: ansible-playbook {{.ANSIBLE_ARGS}} upgrade.yaml --limit {{.HOST}} {{.CLI_ARGS}}

  proxmox-check:
    desc: Dry-run the Proxmox playbook, showing diffs (extra args after --, e.g. -e proxmox_ssh_harden=true)
    dir: "{{.ANSIBLE_DIR}}"
    cmd: mise exec -- ansible-playbook -i ../inventory/hosts.yaml proxmox.yaml --check --diff {{.CLI_ARGS}}

  proxmox-apply:
    desc: Apply the Proxmox playbook (extra args after --, e.g. -e proxmox_ssh_harden=true)
    dir: "{{.ANSIBLE_DIR}}"
    cmd: mise exec -- ansible-playbook -i ../inventory/hosts.yaml proxmox.yaml {{.CLI_ARGS}}
