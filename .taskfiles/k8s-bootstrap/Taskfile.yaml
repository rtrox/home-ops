---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default-requires:
    internal: true
    requires: &default-requires
      vars:
        - &requires-cluster-name
          name: CLUSTER_NAME
          enum: [bitty, mini]

  talos-cluster:
    desc: Bootstrap Talos
    requires: *default-requires
    vars:
      TALOS_CONTROLLER:
        sh: talosctl config use-context ${CLUSTER_NAME} && talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
    preconditions:
      - talosctl config use-context ${CLUSTER_NAME}
      - which jq minijinja-cli sops talosctl
      - echo "{{.TALOSCONFIG}}"
      - test -f "{{.TALOSCONFIG}}"
      - talosctl config info
    cmds:
      - talosctl config use-context ${CLUSTER_NAME}
      - until talosctl --nodes {{.TALOS_CONTROLLER}} bootstrap; do sleep 5; done
      - talosctl kubeconfig --nodes {{.TALOS_CONTROLLER}} --force --force-context-name "${CLUSTER_NAME}" "${KUBECONFIG}"

  doppler-export-token:
    desc: Make the doppler-export store's token (read-only, tf-at-home/export)
    requires: *default-requires
    preconditions:
      - which kubectl doppler
    # Only mini runs the export: anywhere else this is already up to date.
    status:
      - test "{{.CLUSTER_NAME}}" != mini
    cmds:
      # Captured first, so a failed create never overwrites the Secret. Each run
      # makes a new token: revoke the older mini-export-store ones afterwards.
      - cmd: |
          set -eu
          token=$(doppler configs tokens create --project tf-at-home --config export mini-export-store --plain)
          test -n "$token"
          printf %s "$token" | kubectl -n external-secrets create secret generic doppler-export-token --from-file=dopplerToken=/dev/stdin --dry-run=client -o yaml | kubectl --context {{.CLUSTER_NAME}} apply -f -

  apps:
    desc: Bootstrap Apps
    prompt: Bootstrap apps into Talos cluster?
    requires: *default-requires
    preconditions:
      - which yq helmfile kubectl doppler
      - test -f "{{.TALOSCONFIG}}"
      - test -f {{.CLUSTER_DIR}}/bootstrap/resources/namespaces.yaml
      - test -f {{.CLUSTER_DIR}}/bootstrap/helmfile.d/00-crds.yaml
      - test -f {{.CLUSTER_DIR}}/bootstrap/helmfile.d/01-apps.yaml

      - talosctl config info
      # A cluster's Doppler config is named here, not derived from its name.
      - sh: test -n "{{.DOPPLER_CONFIG}}"
        msg: "No Doppler config is listed for {{.CLUSTER_NAME}}: add it to DOPPLER_CONFIG in this task."
    vars:
      # Cluster -> its k8s-at-home config (mini's is min).
      DOPPLER_CONFIG: '{{get (dict "mini" "min") .CLUSTER_NAME | default ""}}'
    env:
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    cmds:
      # - until kubectl wait nodes --for=condition=Ready=False --all --timeout=10m; do sleep 5; done
      - kubectl apply --server-side --filename {{.CLUSTER_DIR}}/bootstrap/resources/namespaces.yaml
      - doppler configs tokens create --project k8s-at-home --config {{.DOPPLER_CONFIG}} doppler-eso --plain | kubectl -n external-secrets create secret generic doppler-token --from-file=dopplerToken=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
      - helmfile --quiet --file {{.CLUSTER_DIR}}/bootstrap/helmfile.d/00-crds.yaml template | yq ea --exit-status 'select(.kind == "CustomResourceDefinition")' - | kubectl apply --server-side --filename -
      - helmfile --file {{.CLUSTER_DIR}}/bootstrap/helmfile.d/01-apps.yaml sync --hide-notes
      # Last: the apps above don't need it.
      - task: doppler-export-token
