---
# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
#
# The shared Blocky config: upstreams, bootstrap resolvers, blocklists,
# allowlists, client groups and caching. One source for every resolver (ns1,
# ns2, dns-a1 now; dns-a2 in mini later), so none of them drifts.
#
# Blocky loads a directory of YAML files and merges them (--config <dir>, since
# v0.37; https://0xerr0r.github.io/blocky/v0.37.0/configuration/ "Multiple
# configuration files"). Ansible (roles/blocky) copies this file to
# /etc/blocky/00-shared.yaml next to a rendered 10-host.yaml with the per-host
# settings (ports, Valkey, query log, clientLookup). Mappings merge recursively
# and lists are replaced, so keep a key in ONE of the two files. Don't put
# secrets here.

upstreams:
  groups:
    default:
      - https://cloudflare-dns.com/dns-query
      - https://dns.quad9.net/dns-query

# Connect to upstreams and list downloads over IPv4 only. The house's IPv6
# (Hurricane Electric tunnel) can't reach GitHub: on 2026-11-22 ns2's
# StevenBlack download timed out over IPv6 (instant over IPv4) and the ads
# denylist came up nearly empty. Clients can still query Blocky over IPv6.
connectIPVersion: v4

# Resolve the upstream hostnames above without depending on the host's own
# resolver (which is Blocky itself, or its neighbour).
bootstrapDns:
  - upstream: https://cloudflare-dns.com/dns-query
    ips:
      - 1.1.1.1
      - 1.0.0.1
  - upstream: https://dns.quad9.net/dns-query
    ips:
      - 9.9.9.9
      - 149.112.112.112

ede:
  enable: true

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  allowlists:
    ads:
      - |
        comcastathena.demdex.net
        dl.cws.xfinity.com
        login.xfinity.com
        oauth.xfinity.com
        business.comcast.com
        assets.adobedtm.com
        static.digital.business.comcast.com
        dpm.demdex.net
        comcastresidentialservices.tt.omtrdc.net
        www.reddit.com
        discourse.pi-hole.net
        img04.en25.com
        xchat.xfinity.com
        script.crazyegg.com
        assets.bounceexchange.com
        api.bounceexchange.com
        events.bouncex.net
        media.xchat.xfinity.com
        files.slack.com
        slack.com
        www.kqzyfj.com
        kqzyfj.com
        cdn.heapanalytics.com
        # Allow Google Ads
        www.googleadservices.com
        dartsearch.net
        www.googletagmanager.com
        www.googletagservices.com
        ad.doubleclick.net
        clickserve.dartsearch.net
        t.myvisualiq.net
        stashdb.org
        segment.com
        s2.bl-1.com

  clientGroupsBlock:
    default:
      - ads
  blockType: zeroIp

caching:
  minTime: 5m
  cacheTimeNegative: 30m
  prefetching: true
