---
fail_fast: false
exclude: |
  (?x)^(
    node_modules/.*|
    \.venv/.*|
    \.pytest_cache/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs
  - repo: https://github.com/sirosen/fix-smartquotes
    rev: 0.2.0
    hooks:
      - id: fix-smartquotes
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # A change touching only prettier-ignored YAML (Taskfiles, *.sops.yaml)
        # would otherwise fail with "No files matching the given patterns".
        args: [--no-error-on-unmatched-pattern]
        types:
          - yaml
        exclude: |
          (?x)^(
            \.archive/.*
          )$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - args:
          - --config-file
          - .github/lint/.yamllint.yaml
        id: yamllint
  - repo: https://github.com/k8s-at-home/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # OpenTofu stacks and modules (terraform/). These run through mise, so
      # the CI pre-commit job skips them; the terraform-check job runs the same
      # commands with mise installed.
      - id: tofu-fmt
        name: tofu fmt
        language: system
        entry: mise exec -- tofu fmt -check -diff
        files: ^terraform/.*\.(tf|tfvars)$
      - id: tflint
        name: tflint
        language: system
        entry: >-
          sh -c 'cd terraform && mise exec -- tflint --init >/dev/null &&
          mise exec -- tflint --recursive --config "$PWD/.tflint.hcl"'
        files: ^terraform/(.*\.tf|\.tflint\.hcl)$
        pass_filenames: false
      - id: terramate-generate
        name: terramate generated files are up to date
        language: system
        # --detailed-exit-code: 0 up to date, 2 regenerated (so fail), 1 error.
        entry: >-
          sh -c 'cd terraform && mise exec -- terramate generate --detailed-exit-code >/dev/null ||
          { echo "Generated files were stale and are now regenerated; review and stage them."; exit 1; }'
        files: ^terraform/
        pass_filenames: false
      # Ansible secrets files must stay vault-encrypted. --negate fails any
      # matching file that does NOT contain the vault header.
      - id: ansible-vault-encrypted
        name: Check Ansible secrets files are vault-encrypted
        language: pygrep
        entry: '^\$ANSIBLE_VAULT;'
        args: [--negate]
        files: ^ansible/.*_secrets\.yaml$
