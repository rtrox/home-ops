---
fail_fast: false
exclude: |
  (?x)^(
    node_modules/.*|
    \.venv/.*|
    \.pytest_cache/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs
  - repo: https://github.com/sirosen/fix-smartquotes
    rev: 0.2.0
    hooks:
      - id: fix-smartquotes
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # A change touching only prettier-ignored YAML (Taskfiles, *.sops.yaml)
        # would otherwise fail with "No files matching the given patterns".
        args: [--no-error-on-unmatched-pattern]
        types:
          - yaml
        exclude: |
          (?x)^(
            cluster-cd/.*|
            \.archive/.*
          )$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - args:
          - --config-file
          - .github/lint/.yamllint.yaml
        id: yamllint
  - repo: https://github.com/k8s-at-home/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets
  - repo: local
    hooks:
      # Ansible secrets files must stay vault-encrypted. --negate fails any
      # matching file that does NOT contain the vault header.
      - id: ansible-vault-encrypted
        name: Check Ansible secrets files are vault-encrypted
        language: pygrep
        entry: '^\$ANSIBLE_VAULT;'
        args: [--negate]
        files: ^ansible/.*_secrets\.yaml$
