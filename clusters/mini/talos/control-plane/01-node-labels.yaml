machine:
  nodeLabels:
    topology.kubernetes.io/region: mini
    topology.kubernetes.io/zone: "1"
    # Talos adds this to control planes by default; the old talhelper config didn't add it, and every
    # node here is a control plane running workloads.
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
