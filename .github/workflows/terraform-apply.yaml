---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: terraform-apply

# Merging to main re-plans and applies, in stack order. Opt-in per stack: only
# stacks tagged `ci-apply` in their stack.tm.hcl are applied; `laptop-only`
# stacks never are. Gating is dynamic: a stack applies straight after merge in
# the `tofu-apply` Environment (no reviewers), unless its post-merge plan has
# any destroy, replace or forget, in which case its apply job waits for owner
# approval in `tofu-apply-gated`. The plan job decides (tf_plan_gate, from
# `tofu show -json` of the saved plan, failing closed) and the apply job
# re-checks its own re-plan. Shared bash: .github/scripts/tf-ci.sh.
#
# home-ops is public, so artifacts and logs are readable. Nothing here uploads
# or prints a plan: init, plan and apply write to files that are never
# printed, and the job summary holds only resource headers and counts.
#
# Approve what you saw:
#   1. `plan` (no Environment, read-only credentials) plans each changed
#      ci-apply stack and shows the headers and counts in its job summary. That
#      summary is what the approver reviews. It outputs a hash of each stack's
#      summary lines.
#   2. `apply` runs one matrix job per stack, strictly in stack order
#      (max-parallel 1, fail-fast). Each job waits on its Environment, then
#      re-plans to a local file with the read-write credentials, recomputes the
#      hash, and refuses to apply if it differs from step 1's. Otherwise it
#      applies that saved plan file and prints only success or failure and the
#      counts. The plan file never leaves the runner.
# A stack with ci-plan-exclude.txt is not applied (the plan would be partial);
# the plan job fails for it. Plan and apply such a stack from the laptop.
#
# PR comment. All commenting runs on GitHub-hosted runners (ubuntu-latest),
# never on the self-hosted ones that hold credentials, so those jobs have no
# `pull-requests: write`. The plan job only emits the per-stack lines (counts
# only: waiting for approval in `tofu-apply-gated` with the gate reason,
# applying now in `tofu-apply`, no changes) and a plan outcome. `announce`
# finds the merged PR and posts them as one sticky comment (header
# `terraform-apply`, separate from terraform-plan's), in parallel with the
# applies. Each apply job uploads its one outcome line (the `Apply complete!`
# counts, or failed / refused) as a tiny artifact; `report` then rebuilds the
# whole comment from the plan lines plus the outcomes, so no line is lost, and
# a stack with no artifact reads "did not run". Only headers, counts and
# result lines are posted, never plan content. Comment steps are
# continue-on-error, and apply's `if` uses always() so a failed announce never
# blocks an apply; `announce` only supplies the environment `url` (the PR, so
# the deployment's "View deployment" opens it; the run URL when there is
# none). workflow_dispatch and pushes with no merged PR post nothing.
#
# Credentials. The read-only plan job uses the same tokens as terraform-plan
# (CI_DOPPLER_TF_READ / CI_DOPPLER_HOSTS_READ, in the runner's environment).
# The apply jobs read the Doppler config tf-at-home/ci-apply with a service
# token stored as the Environment secret CI_DOPPLER_TF_APPLY on BOTH
# Environments (never a repo secret). Keys expected there:
#   R2_STATE_READWRITE        JSON {access_key_id, secret_access_key, endpoint}
#                             (ci has R2_STATE_READONLY with the same shape)
#   TOFU_STATE_PASSPHRASE     same name as in tf-at-home/ci
#   DOPPLER_HOSTS_TOKEN       optional: token for hosts-at-home/ci-apply, for
#                             stacks using the proxmox provider (its API token
#                             is read from there)
#   CLOUDFLARE_TERRAFORM_TOKEN, DOPPLER_*_WRITE_TOKEN, ...
#                             per-provider tokens, added as stacks opt in; the
#                             names match _provider_env.json, generated from
#                             globals in terraform/terramate.tm.hcl
#   CLOUDFLARE_<STACK>_TOKEN  per-stack Cloudflare tokens (e.g.
#                             CLOUDFLARE_DNS_TOKEN), for stacks that set
#                             provider_keys in their stack.tm.hcl
#
# Every push plans EVERY ci-apply stack, so a skipped run (GitHub keeps only
# the newest pending run per concurrency group), a failed plan or a rejected
# approval is retried by the next run or a manual workflow_dispatch. Only
# stacks whose plan has changes are applied. If any plan fails, nothing is
# applied (fail closed).
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "inventory/**"
      - ".github/workflows/terraform-apply.yaml"
      - ".github/scripts/tf-ci.sh"
  workflow_dispatch:

permissions:
  contents: read

# Applies never overlap, and a running apply is never cancelled.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  plan:
    name: Plan changed ci-apply stacks
    if: ${{ github.repository == 'rtrox/home-ops' }}
    runs-on: [self-hosted, home-ops, tofu]
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_outcome: ${{ steps.plan.outputs.plan_outcome }}
      lines: ${{ steps.plan.outputs.lines }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: aqua:astral-sh/uv aqua:opentofu/opentofu aqua:terramate-io/terramate aqua:jqlang/jq

      - name: Read credentials
        run: |
          set -euo pipefail
          source .github/scripts/tf-ci.sh
          tf_read_credentials "$CI_DOPPLER_TF_READ" R2_STATE_READONLY "$CI_DOPPLER_HOSTS_READ"

      - name: Plan changed stacks
        id: plan
        run: |
          set -uo pipefail
          umask 077
          root=$PWD
          source "$root/.github/scripts/tf-ci.sh"
          out=$RUNNER_TEMP/plan
          mkdir -p "$out"
          # The saved plan and its JSON never outlive the step, whatever path
          # leaves the loop.
          summary=$GITHUB_STEP_SUMMARY
          lines=$RUNNER_TEMP/apply-lines.md
          : >"$lines"
          # On every exit: drop the plan files, then emit the public-safe
          # outputs (the comment lines, counts only, and the outcome).
          emit_outputs() {
            local st=$?
            rm -rf "$out"
            {
              if [ "$st" -eq 0 ]; then echo "plan_outcome=success"; else echo "plan_outcome=failed"; fi
              echo "lines<<TF_LINES_EOF"
              if [ -f "$lines" ]; then cat "$lines"; fi
              echo "TF_LINES_EOF"
            } >> "$GITHUB_OUTPUT"
            rm -f "$lines"
          }
          trap emit_outputs EXIT
          failed=false
          matrix='[]'

          # Every ci-apply stack is planned on every push, not just the changed
          # ones: a skipped run, a failed plan or a rejected approval is
          # retried by the next push. Only stacks whose plan has changes (exit
          # code 2) reach the matrix. --run-order gives the apply order.
          cd terraform
          tf_list stacks --tags ci-apply --no-tags laptop-only || exit 1
          # The `gated` tag no longer exists (gating comes from the plan). A
          # stack still carrying it was written for the old rule: fail loudly.
          tf_list legacy --tags gated || exit 1
          if [ ${#legacy[@]} -gt 0 ]; then
            echo "::error::stack(s) still carry the removed 'gated' tag (gating is now decided from the plan): ${legacy[*]}. Remove the tag."
            exit 1
          fi
          echo "Stacks to plan:"
          printf '%s\n' "${stacks[@]:-none}"

          {
            echo "### Terraform apply: plan"
            echo
            echo "Commit \`${GITHUB_SHA::7}\`. Resource headers and counts only. Approve the apply jobs only if this is what you expect."
          } >> "$summary"

          if [ ${#stacks[@]} -eq 0 ]; then
            printf '\nNo ci-apply stacks.\n' >> "$summary"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fail_step() {
            failed=true
            tf_comment_line "$1" "plan failed" "nothing is applied; see the run" >> "$lines"
            printf '\n#### `%s`\n\nFailed at step: **%s**. See the job log (the plan itself is not printed).\n' "$1" "$2" >> "$summary"
          }

          for stack in "${stacks[@]}"; do
            echo "::group::$stack"
            cd "$root/terraform/$stack"
            if [ -f ci-plan-exclude.txt ]; then
              fail_step "$stack" "refused: ci-plan-exclude.txt makes the plan partial, so CI will not apply this stack"
              echo "::endgroup::"; continue
            fi
            if ! tf_export_provider_env; then fail_step "$stack" "provider credentials"; echo "::endgroup::"; continue; fi
            if ! tofu init -input=false -lockfile=readonly -no-color >"$out/init.log" 2>&1; then fail_step "$stack" "tofu init"; echo "::endgroup::"; continue; fi
            rm -f "$out/tfplan" "$out/plan.json"
            # The step shell is `bash -e`: a bare plan exiting 2 (changes) would end the step.
            rc=0
            tofu plan -lock=false -no-color -input=false -detailed-exitcode -out="$out/tfplan" >"$out/plan.log" 2>&1 || rc=$?
            case $rc in 0|2) ;; *) fail_step "$stack" "tofu plan"; echo "::endgroup::"; continue ;; esac
            EXCLUDES=()
            tf_summary_block "$stack" "$out/plan.log" >> "$summary"
            if [ $rc -eq 0 ]; then tf_comment_line "$stack" "no changes" >> "$lines"; fi
            if [ $rc -eq 2 ]; then
              # A plan with changes must show a totals line, or the summary
              # and its hash would be blind to what is being applied.
              if [ -z "$(tf_summary_totals "$out/plan.log")" ]; then fail_step "$stack" "plan has changes but no summary line; refusing"; echo "::endgroup::"; continue; fi
              # Gate on the plan itself. The JSON goes to a file and is never
              # printed; a failure to produce it leaves the file empty, which
              # tf_plan_gate treats as gated (fail closed).
              tofu show -json -no-color "$out/tfplan" >"$out/plan.json" 2>/dev/null || : >"$out/plan.json"
              if reason=$(tf_plan_gate "$out/plan.json" "$out/plan.log"); then
                is_gated=true
                tf_comment_line "$stack" "waiting for approval" "in tofu-apply-gated: $reason" tofu-apply-gated >> "$lines"
                printf '\n> [!IMPORTANT]\n> **Waiting for approval** in `tofu-apply-gated`: %s.\n' "$reason" >> "$summary"
              else
                is_gated=false
                tf_comment_line "$stack" "applying now" "in tofu-apply (no destroys, replaces or forgets)" tofu-apply >> "$lines"
                printf '\nNo destroys, replaces or forgets: applies straight away in `tofu-apply`.\n' >> "$summary"
              fi
              matrix=$(jq -c --arg stack "$stack" --argjson gated "$is_gated" --arg hash "$(tf_summary_hash "$out/plan.log")" \
                '. + [{stack: $stack, gated: $gated, hash: $hash}]' <<<"$matrix")
            fi
            rm -f "$out/plan.log" "$out/init.log" "$out/tfplan" "$out/plan.json"
            echo "::endgroup::"
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$failed" = true ]; then
            echo "At least one stack failed to plan; nothing will be applied."
            exit 1
          fi

  announce:
    name: Announce on the PR
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Find the merged PR
        id: pr
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The first merged PR whose merge commit is this one.
        run: |
          set -uo pipefail
          row=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            | jq -r --arg sha "$SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | first | select(. != null) | "\(.number) \(.html_url)"') || row=""
          if [[ $row =~ ^([0-9]+)\ (https://[^[:space:]]+)$ ]]; then
            echo "pr_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no merged PR found for this commit; not commenting"
          fi
        continue-on-error: true

      - name: Build the comment
        id: comment
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          PLAN_OUTCOME: ${{ needs.plan.outputs.plan_outcome }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LINES: ${{ needs.plan.outputs.lines }}
        run: |
          set -uo pipefail
          body=$RUNNER_TEMP/announce.md
          {
            printf '### Terraform apply\n\nCommit `%s`. Counts and results only; the plan is not printed.\n\n' "${GITHUB_SHA::7}"
            if [ "$PLAN_OUTCOME" != success ] || [ "$PLAN_RESULT" != success ]; then
              printf '**Nothing was applied**: at least one stack failed to plan.\n\n'
            fi
            printf '%s\n' "$PLAN_LINES"
          } >"$body"
          # Nothing to say when the plan succeeded and there are no stacks.
          if [ "$PLAN_OUTCOME" = success ] && [ "$PLAN_RESULT" = success ] && [ -z "$PLAN_LINES" ]; then
            echo "::notice::no ci-apply stacks; not commenting"
          else
            echo "post=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Post the comment
        if: ${{ steps.comment.outputs.post == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: terraform-apply
          number: ${{ steps.pr.outputs.pr_number }}
          path: ${{ runner.temp }}/announce.md
        continue-on-error: true

  apply:
    name: Apply ${{ matrix.stack }}
    needs: [plan, announce]
    # always() so a failed or skipped announce never blocks an apply; the plan
    # must still have succeeded.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]' }}
    # One job per stack, in stack order. Gated stacks wait for approval.
    # `url` makes the deployment's "View deployment" go to the merged PR (the
    # run when announce found none or failed).
    environment:
      name: ${{ matrix.gated && 'tofu-apply-gated' || 'tofu-apply' }}
      url: ${{ needs.announce.outputs.pr_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    runs-on: [self-hosted, home-ops, tofu]
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: aqua:astral-sh/uv aqua:opentofu/opentofu aqua:terramate-io/terramate aqua:jqlang/jq

      - name: Read credentials
        env:
          CI_DOPPLER_TF_APPLY: ${{ secrets.CI_DOPPLER_TF_APPLY }}
        run: |
          set -euo pipefail
          source .github/scripts/tf-ci.sh
          tf_read_credentials "$CI_DOPPLER_TF_APPLY" R2_STATE_READWRITE -DOPPLER_HOSTS_TOKEN

      - name: Re-plan, compare and apply
        env:
          STACK: ${{ matrix.stack }}
          EXPECTED_HASH: ${{ matrix.hash }}
          GATED: ${{ matrix.gated }}
          ENVNAME: ${{ matrix.gated && 'tofu-apply-gated' || 'tofu-apply' }}
        run: |
          set -uo pipefail
          umask 077
          root=$PWD
          source "$root/.github/scripts/tf-ci.sh"
          out=$RUNNER_TEMP/apply
          mkdir -p "$out"
          summary=$GITHUB_STEP_SUMMARY
          printf '### Terraform apply: `%s`\n' "$STACK" >> "$summary"

          # outcome STATUS DETAIL: the PR comment line, posted by a later step.
          outcome() { tf_comment_line "$STACK" "$1" "${2:-}" "$ENVNAME" >"$RUNNER_TEMP/outcome.md"; }

          # stop MESSAGE [STATUS]: write the reason (never output) and fail.
          # STATUS is "failed" (default) or "refused" (hash or gate mismatch).
          stop() {
            printf '\n**%s**\n' "$1" >> "$summary"
            echo "::error::$STACK: $1"
            outcome "${2:-failed}" "(details in the run)"
            exit 1
          }

          cd "$root/terraform/$STACK"
          tf_export_provider_env || stop "could not read the provider credentials"
          tofu init -input=false -lockfile=readonly -no-color >"$out/init.log" 2>&1 || stop "tofu init failed (output is not printed)"

          # Plan to a local file with the read-write credentials. The plan file
          # (encrypted, like state) stays on this runner and is never uploaded.
          # The step shell is `bash -e`: a bare plan exiting 2 (changes) would end the step.
          rc=0
          tofu plan -no-color -input=false -detailed-exitcode -out="$out/tfplan" >"$out/plan.log" 2>&1 || rc=$?
          case $rc in 0|2) ;; *) stop "tofu plan failed (output is not printed)" ;; esac
          if [ $rc -eq 0 ]; then
            printf '\nNo changes any more; nothing to apply.\n' >> "$summary"
            outcome "no changes" "any more; nothing applied"
            exit 0
          fi

          if [ -z "$(tf_summary_totals "$out/plan.log")" ]; then
            stop "The plan has changes but no summary line; refusing to apply blind."
          fi
          if [ "$(tf_summary_hash "$out/plan.log")" != "$EXPECTED_HASH" ]; then
            stop "The plan changed since the plan job showed it. Not applying; re-run the workflow to see the new plan." refused
          fi
          # Re-check the gate on this plan: a destroy, replace or forget must
          # never apply from the ungated Environment, whatever the plan job said.
          tofu show -json -no-color "$out/tfplan" >"$out/plan.json" 2>/dev/null || : >"$out/plan.json"
          if reason=$(tf_plan_gate "$out/plan.json" "$out/plan.log") && [ "$GATED" != true ]; then
            stop "This plan needs approval ($reason) but this job ran without it. Not applying; re-run the workflow." refused
          fi
          EXCLUDES=()
          tf_summary_block "$STACK" "$out/plan.log" >> "$summary"

          if ! tofu apply -input=false -no-color "$out/tfplan" >"$out/apply.log" 2>&1; then
            stop "tofu apply failed (output is not printed); check the state and re-run"
          fi
          result=$(grep -oE '^Apply complete! Resources: [^.]*\.' "$out/apply.log" || echo "Apply finished, no summary line found.")
          printf '\n%s\n' "$result" >> "$summary"
          echo "$STACK: $result"
          outcome applied "$result"

      - name: Write the outcome line
        id: outcome
        if: ${{ always() }}
        env:
          STACK: ${{ matrix.stack }}
          ENVNAME: ${{ matrix.gated && 'tofu-apply-gated' || 'tofu-apply' }}
        # No outcome file means the job stopped before deciding (credentials,
        # cancelled, timed out). The file is the same public line the report
        # job shows, nothing else.
        run: |
          set -uo pipefail
          source .github/scripts/tf-ci.sh
          if [ ! -s "$RUNNER_TEMP/outcome.md" ]; then
            tf_comment_line "$STACK" failed "(did not finish; details in the run)" "$ENVNAME" >"$RUNNER_TEMP/outcome.md" || true
          fi
          echo "name=outcome-${STACK//\//-}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload the outcome line
        if: ${{ always() && steps.outcome.outputs.name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.outcome.outputs.name }}
          path: ${{ runner.temp }}/outcome.md
          retention-days: 3
        continue-on-error: true

      - name: Remove the plan file
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/apply" "$RUNNER_TEMP/outcome.md"

  report:
    name: Report on the PR
    needs: [plan, announce, apply]
    if: ${{ always() && needs.announce.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the outcome lines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: outcome-*
          path: ${{ runner.temp }}/outcomes
        continue-on-error: true

      - name: Build the comment
        id: comment
        env:
          PLAN_OUTCOME: ${{ needs.plan.outputs.plan_outcome }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LINES: ${{ needs.plan.outputs.lines }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          set -uo pipefail
          source .github/scripts/tf-ci.sh
          body=$RUNNER_TEMP/report.md
          {
            printf '### Terraform apply\n\nCommit `%s`. Counts and results only; the plan is not printed.\n\n' "${GITHUB_SHA::7}"
            if [ "$PLAN_OUTCOME" != success ] || [ "$PLAN_RESULT" != success ]; then
              printf '**Nothing was applied**: at least one stack failed to plan.\n\n'
            fi
            printf '%s\n' "$PLAN_LINES"
            results=""
            # One outcome per matrix stack: its artifact line, else "did not
            # run" (rejected, cancelled or skipped).
            while IFS=$'\t' read -r stack gated; do
              [ -n "$stack" ] || continue
              f=$RUNNER_TEMP/outcomes/outcome-${stack//\//-}/outcome.md
              if [ -s "$f" ]; then
                results+="$(head -n 1 "$f")"$'\n'
              else
                env=tofu-apply
                if [ "$gated" = true ]; then env=tofu-apply-gated; fi
                results+="$(tf_comment_line "$stack" "did not run" "(apply job: ${APPLY_RESULT:-unknown}; not approved, cancelled or skipped)" "$env")"$'\n'
              fi
            done < <(jq -r '.[]? | [.stack, (.gated | tostring)] | @tsv' <<<"${MATRIX:-[]}" 2>/dev/null)
            if [ -n "$results" ]; then printf '\n**Results**\n\n%s' "$results"; fi
          } >"$body"
          echo "post=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Update the comment
        if: ${{ steps.comment.outputs.post == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: terraform-apply
          number: ${{ needs.announce.outputs.pr_number }}
          path: ${{ runner.temp }}/report.md
        continue-on-error: true
