---
name: On PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

# NOTE: the reusable workflows are referenced locally (./.github/workflows/...)
# rather than as rtrox/home-ops/...@main, so a PR that changes one of them --
# including Renovate bumping an action pinned inside one -- is actually
# exercised by its own checks instead of silently running main's copy until
# after merge.
jobs:
  simple-checks:
    uses: ./.github/workflows/simple-checks.yaml
    permissions:
      contents: read
      pull-requests: write

  flux-local-bitty:
    uses: ./.github/workflows/flux-local-bitty.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    needs:
      - simple-checks

  flux-local-mini:
    uses: ./.github/workflows/flux-local-mini.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    needs:
      - simple-checks
