---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: terraform-plan

# Plan only: the apply comes later. Runs on the self-hosted runner (a Proxmox
# VM, see ansible/roles/github-runner), one fresh container per job.
#
# home-ops is public, and the logs of a public repo are public too. So the
# commands that read state or live APIs (init, plan) write to files that are
# never printed, and the PR comment holds only the resource headers and counts.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "inventory/**"
      - ".github/workflows/terraform-plan.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan changed stacks
    # Only same-repo PRs reach the runner (forks never do).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, home-ops, tofu]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # uv is here because .mise.toml's [env] section creates a Python venv
      # with it (_.python.venv); without uv that setting has nothing to run.
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: aqua:astral-sh/uv aqua:opentofu/opentofu aqua:terramate-io/terramate aqua:terraform-linters/tflint aqua:jqlang/jq

      # Read-only Doppler service tokens, in the container's environment. Each
      # is scoped to the `ci` config of one project: CI_DOPPLER_TF_READ ->
      # tf-at-home/ci (R2_STATE_READONLY, TOFU_STATE_PASSPHRASE, a read-only
      # Cloudflare token), CI_DOPPLER_HOSTS_READ -> hosts-at-home/ci (a
      # PVEAuditor token). Neither can see `prd`. Values go to later steps
      # through GITHUB_ENV. Nothing here may print a value: jq's errors are
      # discarded (they can quote the input), every value is masked as soon as
      # it's assigned, and every failure is a generic message.
      - name: Read credentials
        run: |
          set -euo pipefail
          fail() { echo "::error::could not read the CI credentials from Doppler"; exit 1; }
          # get EXPR: print a jq field of the JSON on stdin, or fail without output.
          get() { jq -er "$1" 2>/dev/null; }
          # set_secret_env masks the value in every later log line; set_env is
          # for non-secrets (masking "ci" or "1" would blank them all over the log).
          set_secret_env() {
            echo "::add-mask::$2"
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          }
          set_env() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }

          echo "::add-mask::$CI_DOPPLER_TF_READ"
          echo "::add-mask::$CI_DOPPLER_HOSTS_READ"

          secrets=$(curl -fsS --max-time 30 -K - \
            "https://api.doppler.com/v3/configs/config/secrets/download?format=json" \
            <<<"header = \"Authorization: Bearer ${CI_DOPPLER_TF_READ}\"" 2>/dev/null) || fail
          r2=$(get '.R2_STATE_READONLY' <<<"$secrets") || fail
          passphrase=$(get '.TOFU_STATE_PASSPHRASE' <<<"$secrets") || fail
          echo "::add-mask::$passphrase"
          access_key=$(get '.access_key_id' <<<"$r2") || fail
          echo "::add-mask::$access_key"
          secret_key=$(get '.secret_access_key' <<<"$r2") || fail
          echo "::add-mask::$secret_key"
          endpoint=$(get '.endpoint' <<<"$r2") || fail
          unset secrets r2

          set_secret_env AWS_ACCESS_KEY_ID "$access_key"
          set_secret_env AWS_SECRET_ACCESS_KEY "$secret_key"
          set_secret_env AWS_ENDPOINT_URL_S3 "$endpoint"
          set_secret_env TF_VAR_state_passphrase "$passphrase"
          # The generated providers read tf-at-home through DOPPLER_TOKEN and
          # hosts-at-home through var.doppler_hosts_token, both from the config
          # named by var.doppler_config.
          set_secret_env DOPPLER_TOKEN "$CI_DOPPLER_TF_READ"
          set_secret_env TF_VAR_doppler_hosts_token "$CI_DOPPLER_HOSTS_READ"
          set_env TF_VAR_doppler_config ci
          # Terramate's update check phones home; not from this runner.
          set_env TM_DISABLE_CHECKPOINT 1

      - name: Plan changed stacks
        id: plan
        env:
          BASE_REF: origin/${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its plugin from GitHub
        run: |
          set -uo pipefail
          root=$PWD
          out=$RUNNER_TEMP/plan
          mkdir -p "$out"
          summary=$RUNNER_TEMP/summary.md
          failed=false

          cd terraform
          stacks=$(terramate list --changed --git-change-base "$BASE_REF")
          echo "Changed stacks:"
          echo "${stacks:-none}"

          {
            echo "### Terraform plan"
            echo
            echo "Commit \`${GITHUB_SHA::7}\`. Resource headers and counts only; full plans are not posted."
          } > "$summary"

          if [ -z "$stacks" ]; then
            echo >> "$summary"
            echo "No stacks changed." >> "$summary"
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tflint --init >/dev/null 2>&1 || { echo "tflint --init failed"; }

          # fail_step STACK STEP: record the failure, never the output.
          fail_step() {
            failed=true
            printf '\n#### `%s`\n\nPlan failed at step: **%s**. See the job log (the plan itself is not printed).\n' "$1" "$2" >> "$summary"
          }

          for stack in $stacks; do
            echo "::group::$stack"
            dir=$root/terraform/$stack
            cd "$dir"

            # fmt, validate and tflint read only files, so their output is safe to print.
            if ! tofu fmt -check -diff; then fail_step "$stack" "tofu fmt -check"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            # init and plan read state and live APIs: output to files only.
            if ! tofu init -input=false -lockfile=readonly -no-color >"$out/init.log" 2>&1; then fail_step "$stack" "tofu init"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            if ! tofu validate -no-color; then fail_step "$stack" "tofu validate"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            if ! tflint --config "$root/terraform/.tflint.hcl"; then fail_step "$stack" "tflint"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            # A stack can list resource addresses CI must not plan (one per
            # line, # comments) in ci-plan-exclude.txt, e.g. objects the
            # read-only CI credentials can't read. Their dependents are skipped
            # too; the summary says so.
            excludes=()
            if [ -f ci-plan-exclude.txt ]; then
              while IFS= read -r addr; do
                addr=${addr%%#*}; addr=$(echo "$addr" | xargs)
                [ -n "$addr" ] && excludes+=("-exclude=$addr")
              done < ci-plan-exclude.txt
            fi
            if ! tofu plan -lock=false -no-color -input=false "${excludes[@]}" >"$out/plan.log" 2>&1; then fail_step "$stack" "tofu plan"; cd "$root/terraform"; echo "::endgroup::"; continue; fi

            # Keep only "# <type.name> will be <action>" headers and the
            # Plan:/No changes lines. for_each keys and indexes become [...]
            # first, so no key value reaches the public comment; everything
            # else in the plan is dropped.
            {
              printf '\n#### `%s`\n\n' "$stack"
              headers=$(sed -E 's/\[[^]]*\]/[…]/g' "$out/plan.log" \
                | grep -oE '^  # [^ ]+ (will be|must be) (created|updated in-place|destroyed|replaced|read during apply)' || true)
              totals=$(grep -oE '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\.)' "$out/plan.log" || true)
              if [ -n "$headers" ]; then
                printf '```\n%s\n```\n\n' "$headers"
              fi
              printf '%s\n' "${totals:-Plan finished, no summary line found.}"
              if [ ${#excludes[@]} -gt 0 ]; then
                printf '\nNot planned in CI (ci-plan-exclude.txt, and anything depending on them): %s. Plan these from the laptop.\n' \
                  "$(printf '`%s` ' "${excludes[@]#-exclude=}")"
              fi
            } >> "$summary"
            rm -f "$out/plan.log" "$out/init.log"
            echo "::endgroup::"
            cd "$root/terraform"
          done

          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post the plan summary
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: terraform-plan
          path: ${{ runner.temp }}/summary.md
        # A crash before the summary exists posts nothing.
        continue-on-error: true

      - name: Fail if a plan failed
        if: ${{ steps.plan.outputs.failed == 'true' }}
        run: |
          echo "At least one stack failed; see the summary comment for the step."
          exit 1
