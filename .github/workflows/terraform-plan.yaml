---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: terraform-plan

# Plan only: terraform-apply.yaml applies on merge. Runs on the self-hosted
# runner (a Proxmox VM, see ansible/roles/github-runner), one fresh container
# per job. Shared bash lives in .github/scripts/tf-ci.sh.
#
# home-ops is public, and the logs of a public repo are public too. So the
# commands that read state or live APIs (init, plan) write to files that are
# never printed, and the PR comment holds only the resource headers and counts.
#
# Stacks tagged `laptop-only` (they need the owner's personal Doppler token)
# are never planned here; the comment lists them with a pointer to the laptop.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "inventory/**"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/scripts/tf-ci.sh"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan changed stacks
    # Only same-repo PRs reach the runner (forks never do).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, home-ops, tofu]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # uv is here because .mise.toml's [env] section creates a Python venv
      # with it (_.python.venv); without uv that setting has nothing to run.
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: aqua:astral-sh/uv aqua:opentofu/opentofu aqua:terramate-io/terramate aqua:terraform-linters/tflint aqua:jqlang/jq

      # Read-only Doppler service tokens, in the container's environment. Each
      # is scoped to the `ci` config of one project: CI_DOPPLER_TF_READ ->
      # tf-at-home/ci (R2_STATE_READONLY, TOFU_STATE_PASSPHRASE, a read-only
      # Cloudflare token), CI_DOPPLER_HOSTS_READ -> hosts-at-home/ci (a
      # PVEAuditor token). Neither can see `prd`. tf_read_credentials masks
      # every value as soon as it is assigned and passes it to later steps
      # through GITHUB_ENV; nothing prints a value.
      - name: Read credentials
        run: |
          set -euo pipefail
          source .github/scripts/tf-ci.sh
          tf_read_credentials "$CI_DOPPLER_TF_READ" R2_STATE_READONLY ci "$CI_DOPPLER_HOSTS_READ"

      - name: Plan changed stacks
        id: plan
        env:
          BASE_REF: origin/${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its plugin from GitHub
        run: |
          set -uo pipefail
          root=$PWD
          source "$root/.github/scripts/tf-ci.sh"
          out=$RUNNER_TEMP/plan
          mkdir -p "$out"
          summary=$RUNNER_TEMP/summary.md
          failed=false

          cd terraform
          # laptop-only stacks need the owner's personal Doppler token, so CI
          # never plans them; the comment says to do it by hand.
          stacks=$(terramate list --changed --no-tags laptop-only --git-change-base "$BASE_REF")
          laptop=$(terramate list --changed --tags laptop-only --git-change-base "$BASE_REF")
          echo "Changed stacks:"
          echo "${stacks:-none}"
          echo "Changed laptop-only stacks:"
          echo "${laptop:-none}"

          {
            echo "### Terraform plan"
            echo
            echo "Commit \`${GITHUB_SHA::7}\`. Resource headers and counts only; full plans are not posted."
          } > "$summary"

          laptop_notes() {
            local s
            for s in $laptop; do
              printf '\n`%s` changed: plan and apply it from the laptop (`task tf:plan STACK=%s`).\n' "$s" "$(basename "$s")" >> "$summary"
            done
          }

          if [ -z "$stacks" ]; then
            echo >> "$summary"
            echo "No CI-planned stacks changed." >> "$summary"
            laptop_notes
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tflint --init >/dev/null 2>&1 || { echo "tflint --init failed"; }

          # fail_step STACK STEP: record the failure, never the output.
          fail_step() {
            failed=true
            printf '\n#### `%s`\n\nPlan failed at step: **%s**. See the job log (the plan itself is not printed).\n' "$1" "$2" >> "$summary"
          }

          for stack in $stacks; do
            echo "::group::$stack"
            dir=$root/terraform/$stack
            cd "$dir"

            # fmt, validate and tflint read only files, so their output is safe to print.
            if ! tofu fmt -check -diff; then fail_step "$stack" "tofu fmt -check"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            # init and plan read state and live APIs: output to files only.
            if ! tofu init -input=false -lockfile=readonly -no-color >"$out/init.log" 2>&1; then fail_step "$stack" "tofu init"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            if ! tofu validate -no-color; then fail_step "$stack" "tofu validate"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            if ! tflint --config "$root/terraform/.tflint.hcl"; then fail_step "$stack" "tflint"; cd "$root/terraform"; echo "::endgroup::"; continue; fi
            # A stack can list resource addresses CI must not plan (one per
            # line, # comments) in ci-plan-exclude.txt, e.g. objects the
            # read-only CI credentials can't read. Their dependents are skipped
            # too; the summary says so.
            tf_excludes
            if ! tofu plan -lock=false -no-color -input=false "${EXCLUDES[@]}" >"$out/plan.log" 2>&1; then fail_step "$stack" "tofu plan"; cd "$root/terraform"; echo "::endgroup::"; continue; fi

            tf_summary_block "$stack" "$out/plan.log" >> "$summary"
            rm -f "$out/plan.log" "$out/init.log"
            echo "::endgroup::"
            cd "$root/terraform"
          done

          laptop_notes
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post the plan summary
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: terraform-plan
          path: ${{ runner.temp }}/summary.md
        # A crash before the summary exists posts nothing.
        continue-on-error: true

      - name: Fail if a plan failed
        if: ${{ steps.plan.outputs.failed == 'true' }}
        run: |
          echo "At least one stack failed; see the summary comment for the step."
          exit 1
