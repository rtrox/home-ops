---
name: "Simple Checks"

on:
  workflow_call:

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
      # Without --all-files or a ref range, `pre-commit run` only checks
      # *staged* files -- of which there are none in CI, so every hook used to
      # report "(no files to check) Skipped". Check what the PR changed vs the
      # default branch instead.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: >-
            --config .pre-commit-config.yaml
            --from-ref origin/${{ github.event.repository.default_branch }}
            --to-ref HEAD

  lint-yaml:
    name: Lint Yaml Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            yaml:
              - added|modified: "**.yaml"
              - added|modified: "**.yml"

      - name: "Yamllint"
        if: ${{ steps.filter.outputs.yaml == 'true' }}
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "${{ steps.filter.outputs.yaml_files }}"
          strict: false
          config_file: .github/lint/.yamllint.yaml
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  renovate-config-validator:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    # The official Renovate image ships the validator and its dependencies, so
    # the check runs the same Renovate version as the real thing (pinned and
    # bumped by Renovate itself) instead of whatever an action bundles.
    container:
      image: ghcr.io/renovatebot/renovate:44.257.9@sha256:d6b65ff3562dd499240b23d34ef806ec7e5fd2675e4236a027dfb36774f2aa75
      # The image runs as an unprivileged user that cannot write the workspace.
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            renovate:
              - added|modified: ".github/renovate.json5"
              - added|modified: ".github/renovate/**.json5"
              - added|modified: ".github/workflows/simple-checks.yaml"

      # Validate every file, not just renovate.json5: the presets under
      # .github/renovate/ are pulled in as remote presets from main, so a PR
      # that edits one would otherwise be checked against main's old copy.
      # --strict fails on warnings (e.g. "config migration necessary") too.
      - name: Validate Renovate Config
        if: ${{ steps.filter.outputs.renovate == 'true' }}
        env:
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          renovate-config-validator --strict --no-global
          .github/renovate.json5
          .github/renovate/*.json5

  lint_success:
    needs:
      - pre-commit-check
      - lint-yaml
      - renovate-config-validator
    if: ${{ !cancelled() }}
    name: Lint successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
