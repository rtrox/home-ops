---
# The SSH user isn't committed: it comes from Doppler (hosts-at-home/prd,
# ANSIBLE_SSH_USER). The ansible tasks run under `doppler run`, which puts it in
# the environment. If it's empty, undef() fails the run before any connection.
ansible_user: "{{ lookup('env', 'ANSIBLE_SSH_USER') or undef(hint='ANSIBLE_SSH_USER is empty: run via task ansible:..., which wraps doppler run (see ansible/README.md)') }}"
