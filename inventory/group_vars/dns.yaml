---
# The house Pis (ns1, ns2). The shared Blocky upstreams (cluster-apps/components/blocky/00-shared.yaml)
# apply unless this is uncommented, which keeps the house's previous upstreams.
# blocky_legacy_upstreams: true

# Both Blockys use ns1's Valkey, by its own address, not the VIP: after a
# failover, a connection made while the VIP was elsewhere can stay open and
# dead (ns2 missed ns1's updates until Blocky restarted, Nov 25, 2026). Sharing
# needs both hosts up anyway; with ns1 down, ns2 just runs on its own cache.
blocky_redis_address: "{{ hostvars['ns1.rtrox.io'].ansible_host }}:{{ valkey_port | default(6379) }}"

# The house resolvers' Valkey database number.
blocky_redis_database: 1

# Reverse lookups of client names go to the house's router.
blocky_upstream: 172.30.0.254

# The DNS VIP (dns-vip in hosts.yaml) and its IPv6 counterpart.
keepalived_vip_address: 172.30.99.10
keepalived_vip_address_v6: 2001:470:e899:9932:3099::10/112

# From Doppler ansible/prd (generated by the dns stack), which task ansible:* runs under.
valkey_password: "{{ lookup('env', 'VALKEY_HOUSE_PASSWORD') }}"
keepalived_auth_password: "{{ lookup('env', 'KEEPALIVED_HOUSE_PASSWORD') }}"
