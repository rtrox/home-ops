---
# yaml-language-server: $schema=./schema/hosts.schema.json
#
# Hosts, in Ansible's YAML inventory format. Replaces the "Reserved IPs" tab of
# the VLAN spreadsheet and the old local-only ansible/inventory.yaml.
#
# Every host carries `site` and `vlan` (keys into sites.yaml) and, where known,
# `address` and `dns_name`. `subnet` is optional. Validated in CI by
# `task inventory:check`.
#
# The SSH user is rtrox everywhere (inventory/group_vars/all.yaml).
#
# `unmanaged` holds hosts that need DNS (and DHCP leases, firewall rules) but
# don't run Ansible plays. The plays that target `all` exclude it.
all:
  children:
    dns:
      hosts:
        ns1.rtrox.io:
          ansible_host: 172.30.99.1
          keepalived_state: MASTER
          site: house # reached over ZeroTier
          vlan: trusted
          subnet: network-services
          address: 172.30.99.1
          dns_name: ns1.rtrox.io
        ns2.rtrox.io:
          ansible_host: 172.30.99.2
          keepalived_state: BACKUP
          site: house # reached over ZeroTier
          vlan: trusted
          subnet: network-services
          address: 172.30.99.2
          dns_name: ns2.rtrox.io

    avahi:
      hosts:
        avahi.rtrox.io:
          ansible_host: 172.30.99.3
          vlan_interfaces:
            - interface: "eth0"
              vlan_id: 200
            - interface: "eth0"
              vlan_id: 300
          site: house
          vlan: trusted
          subnet: network-services
          address: 172.30.99.3
          dns_name: avahi.rtrox.io
          # Also on the IoT and Guest VLANs (mDNS reflector).
          extra_addresses:
            - { vlan: iot, address: 172.29.99.3 }
            # TODO: the sheet has 172.31.99.3 for the guest VLAN, which is
            # outside the guest subnet (172.31.0.0/24). Pick an address inside
            # 172.31.0.0/24 and add {vlan: guest, address: ...} here.

    # The Raspberry Pis (the common play in site.yaml and upgrade.yaml).
    pis:
      children:
        dns:
        avahi:

    # Hosts that are down: they stay in the inventory (their addresses and
    # names stay reserved) but every play skips them. avahi's Pi is broken
    # until the move back to the house (about May 2027) and will likely be
    # rebuilt; the node-exporter scrape config skips it too. It never got the
    # rtrox user, so bootstrap it with -e ansible_user=<its old user> once.
    offline:
      children:
        avahi:

    proxmox:
      hosts:
        pve.rtrox.io:
          ansible_host: 172.21.1.21
          proxmox_ssh_github_username: rtrox
          site: apartment
          vlan: trusted
          subnet: servers
          address: 172.21.1.21
          dns_name: pve.rtrox.io

    # VMs on Proxmox (terraform/stacks/proxmox), configured by Ansible once their
    # roles exist (runner: #8, dns-a1: #9). A group of their own, not `unmanaged`.
    # The plays that target `all:!unmanaged` would match it, but every task in
    # .taskfiles/ansible passes --limit, so nothing runs against it until named.
    vms:
      hosts:
        runner.rtrox.io:
          ansible_host: 172.21.1.30
          site: apartment
          vlan: trusted
          subnet: servers
          address: 172.21.1.30
          dns_name: runner.rtrox.io
          purpose: CI runner (Proxmox VM, never manages its own VM)
      children:
        dns_apartment:

    # The apartment's resolvers (the `dns_apartment` play in site.yaml): Blocky
    # and Valkey, no keepalived. dns-a2 is Blocky in mini, not a host here.
    # Kept apart from `dns` (the house Pis), whose plays never touch these.
    dns_apartment:
      hosts:
        dns-a1.rtrox.io:
          ansible_host: 172.21.99.1
          site: apartment
          vlan: trusted
          subnet: network-services
          address: 172.21.99.1
          dns_name: dns-a1.rtrox.io
          purpose: DNS (Proxmox VM)

    unmanaged:
      hosts:
        # --- Apartment: servers and the mini cluster ---
        nas.rtrox.io:
          site: apartment
          vlan: trusted
          subnet: servers
          address: 172.21.1.12
          dns_name: nas.rtrox.io
          purpose: Primary NAS (HL15)
          # At the move the NAS goes back to the house: 172.30.1.12 (Trusted,
          # servers). The sheet's TrueNAS 1 row has that address.
          moves_to: { site: house, vlan: trusted, address: 172.30.1.12 }
        node01.mini.rtrox.io:
          site: apartment
          vlan: trusted
          subnet: mini-nodes
          address: 172.21.31.1
          dns_name: node01.mini.rtrox.io
          purpose: Kubernetes (mini)
          moves_to: { site: house, vlan: trusted, address: 172.30.31.1 }
        node02.mini.rtrox.io:
          site: apartment
          vlan: trusted
          subnet: mini-nodes
          address: 172.21.31.2
          dns_name: node02.mini.rtrox.io
          purpose: Kubernetes (mini)
          moves_to: { site: house, vlan: trusted, address: 172.30.31.2 }
        node03.mini.rtrox.io:
          site: apartment
          vlan: trusted
          subnet: mini-nodes
          address: 172.21.31.3
          dns_name: node03.mini.rtrox.io
          purpose: Kubernetes (mini)
          moves_to: { site: house, vlan: trusted, address: 172.30.31.3 }

        # --- House: management VLAN ---
        # TODO confirm: iLO of the primary NAS, which currently sits in the
        # apartment. Kept at the sheet's house address.
        nas-mgmt:
          site: house
          vlan: management
          address: 172.28.1.12
          purpose: iLO (primary NAS)
        u6-pro-closet:
          site: house
          vlan: management
          subnet: network-gear
          address: 172.28.99.245
          purpose: Access point (network closet)
        u6-pro-office-2: # sheet row 39
          site: house
          vlan: management
          subnet: network-gear
          address: 172.28.99.246
          purpose: Access point
        unifi-poe-80w-office-2: # sheet row 40
          site: house
          vlan: management
          subnet: network-gear
          address: 172.28.99.247
          purpose: Switch
        unifi-poe-180w-office-1: # sheet row 41
          site: house
          vlan: management
          subnet: network-gear
          address: 172.28.99.248
          purpose: Switch
        unifi-poe-48-port:
