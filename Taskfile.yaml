---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set:
  - pipefail
shopt:
  - globstar

vars:
  # Mini is the only cluster. Override with the environment variable
  # (CLUSTER_NAME=bitty task ...): in go-task 3.46, `task foo CLUSTER_NAME=x`
  # on the command line doesn't reach these top-level vars.
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "mini"}}'
  CLUSTER_DIR: "{{.ROOT_DIR}}/clusters/{{.CLUSTER_NAME}}"
  TALOS_DIR: "{{.CLUSTER_DIR}}/talos"
  TALOSCONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"

includes:
  ansible: .taskfiles/ansible/Taskfile.yaml
  flux: .taskfiles/flux/Taskfile.yaml
  # k8s: .taskfiles/k8s/Taskfile.yaml
  k8s-bootstrap: .taskfiles/k8s-bootstrap/Taskfile.yaml
  # postgres: .taskfiles/postgres/Taskfile.yaml
  # sops: .taskfiles/sops/Taskfile.yaml
  talos: .taskfiles/talos/Taskfile.yaml
  # volsync: .taskfiles/volsync/Taskfile.yaml

tasks:
  default:
    silent: true
    cmd: task --list

  noop:
    internal: true
    silent: true
    cmd: noop() { :; }
