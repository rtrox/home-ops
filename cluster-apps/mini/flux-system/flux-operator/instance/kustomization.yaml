---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flux-system

# Flux's own instance must never be garbage-collected by a Kustomization that
# is merely tidying up (e.g. cluster-apps). Removing it takes a deliberate delete.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled

resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
  - ./podmonitor.yaml
  - ./github/
configMapGenerator:
  - name: flux-instance-helm-values
    files:
      - values.yaml=./values.yaml
configurations:
  - kustomizeconfig.yaml
