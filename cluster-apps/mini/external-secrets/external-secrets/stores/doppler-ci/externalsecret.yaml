---
# The store's read-only token for k8s-at-home/min-ci. Terraform's foundation
# stack makes it and writes it to k8s-at-home/min.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-ci-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: doppler-ci-token
    creationPolicy: Owner
  data:
    - secretKey: dopplerToken
      remoteRef:
        key: DOPPLER_CI_STORE_TOKEN
