---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shelfmark
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          shelfmark:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.6.1@sha256:0e5c9ff5f858a9695dc18bc355d8aa29dfee5c0d9c634919484c2bab9955ad5a
            # OIDC via pocket-id. These match what was previously saved through
            # Shelfmark's settings page (config volume), so behavior is unchanged;
            # declaring them here makes it reproducible. The client id/secret come
            # from the shelfmark-secret ExternalSecret. Local login stays enabled
            # (HIDE_LOCAL_AUTH / DISABLE_LOCAL_AUTH unset) as a fallback.
            env:
              AUTH_METHOD: oidc
              OIDC_DISCOVERY_URL: https://auth.rtrox.io/.well-known/openid-configuration
              OIDC_SCOPES: openid,email,profile
              OIDC_GROUP_CLAIM: groups
              OIDC_USE_ADMIN_GROUP: "true"
              OIDC_ADMIN_GROUP: admins
              OIDC_AUTO_PROVISION: "true"
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            command:
              - gunicorn
            args:
              - --access-logfile=-
              - --error-logfile=-
              - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
              - --workers=1
              - -t
              - "300"
              - -b
              - 0.0.0.0:8084
              - shelfmark.main:app
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8084
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: shelfmark
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - shelfmark.rtrox.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: shelfmark
      nfs-nas-media:
        type: nfs
        server: nas.rtrox.io
        path: /mnt/rusty/media
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /media
              - path: /bookdrop
                subPath: .bookdrop
      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
