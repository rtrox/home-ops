---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: qui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        QUI__SESSION_SECRET: "{{ .QUI__SESSION_SECRET }}"
        QUI__OIDC_CLIENT_ID: "{{ .client_id }}"
        QUI__OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: QUI
    - extract:
        key: QUI_POCKETID_CLIENT
