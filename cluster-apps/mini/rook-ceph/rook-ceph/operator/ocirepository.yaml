---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Tracks latest. Rook chart bumps never auto-merge (see
    # .github/renovate/autoMerge.json5) -- check the Rook/Ceph support
    # matrix before merging one, same as every other cluster.
    tag: v1.20.6
  url: oci://ghcr.io/rook/rook-ceph
