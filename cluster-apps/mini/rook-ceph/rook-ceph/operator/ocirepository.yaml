---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Held at v1.19.x -- v1.20 (Tentacle) is flagged flaky in
    # .github/renovate/allowedVersions.json5. Chongus currently runs
    # v1.20.1 anyway (predates the hold, or the hold went stale); mini is
    # a fresh deployment so there's no reason to knowingly start on the
    # version the repo's own config says to avoid.
    tag: v1.19.6
  url: oci://ghcr.io/rook/rook-ceph
