---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Matches the operator -- see operator/ocirepository.yaml for why mini
    # tracks latest instead of the repo-wide v1.19.x hold.
    tag: v1.20.6
  url: oci://ghcr.io/rook/rook-ceph-cluster
