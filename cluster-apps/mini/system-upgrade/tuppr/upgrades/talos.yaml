---
# Keep in sync with clusters/mini/talos/talconfig.yaml's talosVersion.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # talconfig.yaml stays on 1.13.12 until its patches are migrated to the
    # Talos 1.14 document kinds (talhelper rejects the 1.14 contract with the
    # current v1alpha1 apiServer/scheduler/proxy/search-domain patches). The
    # nodes keep their existing machine config, which 1.14 still accepts.
    version: v1.14.5
  policy:
    rebootMode: default
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
