---
# Keep in sync with clusters/mini/talos/talconfig.yaml's kubernetesVersion --
# this should always match what's actually running so there's nothing
# spuriously pending. Bump both together, deliberately, checking Talos
# compatibility first (see the "Never Automerge Kubernetes" Renovate rule).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    version: v1.36.4
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
