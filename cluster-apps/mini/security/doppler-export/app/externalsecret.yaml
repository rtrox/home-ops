---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-export
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: doppler-export-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The Doppler provider ignores remoteRef.property, so each Doppler
        # secret is fetched whole below and unpacked here with fromJson; only
        # the fields the job needs end up in this Secret.
        # JSON object: "project/config" -> read-only service token.
        DOPPLER_EXPORT_TOKENS: "{{ .tokens_json }}"
        # Destination: Backblaze B2 via the native b2 backend (the S3
        # endpoint in the Doppler secret is deliberately unused).
        RCLONE_CONFIG_B2_TYPE: b2
        RCLONE_CONFIG_B2_ACCOUNT: "{{ (.b2_json | fromJson).application_key_id }}"
        RCLONE_CONFIG_B2_KEY: "{{ (.b2_json | fromJson).application_key }}"
        B2_BUCKET: "{{ (.b2_json | fromJson).bucket }}"
        HC_PING_URL: "{{ (.hc_json | fromJson).doppler_export_ping_url }}"
  data:
    # From tf-at-home/export, generated by the foundation stack.
    - secretKey: tokens_json
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: doppler-export
      remoteRef:
        key: DOPPLER_EXPORT_TOKENS
    - secretKey: b2_json
      remoteRef:
        key: SECRETS_BACKUP_BACKBLAZE_BUCKET
    - secretKey: hc_json
      remoteRef:
        key: HEALTHCHECKS
