---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-state-copy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: tofu-state-copy-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # rclone remotes are configured purely through env vars, so no config
        # file with credentials is ever rendered.
        # The Doppler provider ignores remoteRef.property, so each Doppler
        # secret is fetched whole below and unpacked here with fromJson.
        # Source: the Cloudflare R2 bucket holding the encrypted OpenTofu
        # state. The token is read-only; the job never writes to it.
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ENDPOINT: "{{ (.r2_json | fromJson).endpoint }}"
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ (.r2_json | fromJson).access_key_id }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ (.r2_json | fromJson).secret_access_key }}"
        SRC_BUCKET: "{{ (.r2_json | fromJson).bucket }}"
        # Destination: Backblaze B2 via the native b2 backend (the S3
        # endpoint in the Doppler secret is deliberately unused).
        RCLONE_CONFIG_HISTORY_TYPE: b2
        RCLONE_CONFIG_HISTORY_ACCOUNT: "{{ (.history_json | fromJson).application_key_id }}"
        RCLONE_CONFIG_HISTORY_KEY: "{{ (.history_json | fromJson).application_key }}"
        DST_BUCKET: "{{ (.history_json | fromJson).bucket }}"
        HC_PING_URL: "{{ (.hc_json | fromJson).tofu_state_copy_ping_url }}"
  data:
    - secretKey: r2_json
      remoteRef:
        key: TOFU_STATE_R2_SOURCE
    - secretKey: history_json
      remoteRef:
        key: TOFU_STATE_HISTORY_BACKBLAZE_BUCKET
    - secretKey: hc_json
      remoteRef:
        key: HEALTHCHECKS
