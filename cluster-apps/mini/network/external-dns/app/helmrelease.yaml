---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: externaldns
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  valuesFrom:
    - kind: ConfigMap
      name: external-dns-values
  values:
    txtOwnerId: mini
  # Not chart values: post-renderers are a HelmRelease field. Stops Kubernetes
  # injecting a *_SERVICE_HOST/*_PORT env var per Service in the namespace,
  # which external-dns does not need.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: external-dns
            patch: |
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
