---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policy/poddisruptionbudget_v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocky
spec:
  # Keep one dns-a2 replica through node drains (tuppr upgrades).
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
