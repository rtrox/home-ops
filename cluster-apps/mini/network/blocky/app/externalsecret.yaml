---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
# dns-a2's per-host Blocky settings (the equivalent of ansible/roles/blocky's
# 10-host.yaml.j2). A Secret, not a ConfigMap, because it carries the Valkey
# password (Blocky doesn't expand environment variables in its config).
# Doppler BLOCKY_APARTMENT is JSON: {"valkey_password": "..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocky-host
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: blocky-host
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        10-host.yaml: |
          # Rendered by ExternalSecret blocky-host; shared settings are in 00-shared.yaml.
          ports:
            dns: 5353   # the Service maps 53 -> 5353 (no privileged port in the pod)
            http: 4000  # the Service maps 80 -> 4000

          clientLookup:
            upstream: 172.21.254.1 # the apartment's router (inventory/sites.yaml)
            singleNameOrder:
              - 2
              - 1

          # dns-a1's Valkey (inventory/hosts.yaml): shared cache and blocking state.
          redis:
            address: "172.21.99.1:6379"
            password: "{{ (.apartment | fromJson).valkey_password }}"
            database: 0
            required: false

          log:
            level: info
            format: json

          # One JSON line per query on stdout; Alloy ships it to Loki.
          queryLog:
            type: console

          prometheus:
            enable: true
            path: /metrics
  data:
    - secretKey: apartment
      remoteRef:
        key: BLOCKY_APARTMENT
