---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# dns-a2: the apartment's second resolver. Same shared config as dns-a1 and the
# house Pis; Valkey on dns-a1 keeps cache and blocking state in sync.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: blocky
  values:
    controllers:
      blocky:
        # Two replicas on different nodes behind the LoadBalancer IP
        # (externalTrafficPolicy Cluster): a pod or node failure is invisible to
        # clients, like the house Pis' VIP. dns-a2 is the apartment's first
        # DHCP resolver for that reason; dns-a1 is second.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: blocky
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
        containers:
          app:
            image:
              # Same image and digest as ansible/roles/blocky/defaults/main.yaml.
              repository: docker.io/spx01/blocky
              tag: v0.37.0@sha256:d9b6344d7c8f3fe577a47bc97b523faa116f7ea8a8901bfaf800a4dbdce64c96
            args:
              - --config
              - /etc/blocky
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &httpPort 4000
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  # Ready means DNS answers, not only the API.
                  tcpSocket:
                    port: 5353
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 2
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *httpPort
                  periodSeconds: 5
                  failureThreshold: 60 # first start downloads the blocklists
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      shared:
        type: configMap
        name: blocky-shared
        globalMounts:
          - path: /etc/blocky/00-shared.yaml
            subPath: 00-shared.yaml
            readOnly: true
      host:
        type: secret
        name: blocky-host
        globalMounts:
          - path: /etc/blocky/10-host.yaml
            subPath: 10-host.yaml
            readOnly: true

    service:
      app:
        type: LoadBalancer
        # Cluster, like every other LoadBalancer here: mini's LB IPs aren't
        # announced per node (no L2 announcements or BGP), so traffic can arrive
        # on any node, and Local made the nodes without the pod refuse it.
        # Cilium runs in DSR mode (bpf-lb-mode=dsr), so client IPs are still
        # preserved for Blocky's client groups and query log.
        externalTrafficPolicy: Cluster
        annotations:
          # Reserved in inventory/sites.yaml (loadbalancer_pools.mini.reserved.dns-a2).
          # A hard-coded copy: change it there and here together (phase 8 move checklist).
          lbipam.cilium.io/ips: 172.19.32.53
        ports:
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP
          # The Blocky HTTP API (/api/blocking/..., /metrics), so
          # curl http://<ip>/api/blocking/disable works on the LAN.
          http:
            port: 80
            targetPort: *httpPort
            protocol: TCP

    serviceMonitor:
      app:
        serviceName: blocky
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
