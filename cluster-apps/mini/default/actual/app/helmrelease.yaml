---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual
spec:
  chartRef:
    kind: OCIRepository
    name: actual
  interval: 30m
  values:
    controllers:
      actual:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/actualbudget/actual
              tag: 26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
            env:
              ACTUAL_PORT: &httpPort 5006
              # pocket-id OIDC -- adds a login option alongside the server
              # password, same as komga/grafana/qui/autobrr. Not enforced
              # (ACTUAL_OPENID_ENFORCE unset/false): both login methods stay
              # available.
              ACTUAL_OPENID_DISCOVERY_URL: https://auth.rtrox.io/.well-known/openid-configuration
              ACTUAL_OPENID_SERVER_HOSTNAME: https://actual.rtrox.io
            envFrom:
              - secretRef:
                  name: actual-oidc-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 12m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: actual
        globalMounts:
          - path: /data
    route:
      app:
        hostnames:
          - actual.rtrox.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    service:
      app:
        ports:
          http:
            port: *httpPort
