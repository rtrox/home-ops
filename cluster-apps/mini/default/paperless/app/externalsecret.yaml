---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_ADMIN_USER: "admin"
        PAPERLESS_ADMIN_PASSWORD: "{{ .paperless_admin_password }}"
        PAPERLESS_SECRET_KEY: "{{ .paperless_secret_key }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "OAUTH_PKCE_ENABLED": true,
              "APPS": [
                {
                  "provider_id": "pocketid",
                  "name": "PocketID",
                  "client_id": "{{ .client_id }}",
                  "secret": "{{ .client_secret }}",
                  "oauth_pkce_enabled": true,
                  "settings": {
                    "server_url": "https://auth.rtrox.io/.well-known/openid-configuration"
                  }
                }
              ]
            }
          }
  # PAPERLESS_POCKETID_CLIENT and PAPERLESS_SECRET_KEY are written by the
  # clusters/mini-services stack (../infra.yaml, paperless.tf).
  dataFrom:
    - extract:
        key: PAPERLESS_POCKETID_CLIENT
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: doppler-ci
  data:
    - secretKey: paperless_admin_password
      remoteRef:
        key: PAPERLESS_ADMIN_PASSWORD
    - secretKey: paperless_secret_key
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: doppler-ci
      remoteRef:
        key: PAPERLESS_SECRET_KEY
