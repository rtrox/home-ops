---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: sure-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .secret_key_base }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        # Explicit keys, decoupled from SECRET_KEY_BASE -- without these
        # Sure still auto-derives working encryption from SECRET_KEY_BASE
        # in self-hosted mode, but logs a [SECURITY] warning on every boot
        # until all three are set (partial is worse: it raises at boot).
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{{ .active_record_encryption_primary_key }}"
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{{ .active_record_encryption_deterministic_key }}"
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{{ .active_record_encryption_key_derivation_salt }}"
  dataFrom:
    - extract:
        key: SURE
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-minio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: sure-minio-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GENERIC_S3_ENDPOINT: "http://{{ .endpoint }}"
        GENERIC_S3_BUCKET: "{{ .bucket }}"
        GENERIC_S3_ACCESS_KEY_ID: "{{ .application_key_id }}"
        GENERIC_S3_SECRET_ACCESS_KEY: "{{ .application_key }}"
  dataFrom:
    - extract:
        key: SURE_MINIO_BUCKET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: sure-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: SURE_POCKETID_CLIENT
