---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komga-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: komga-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_POCKETID_CLIENT_ID: "{{ .client_id }}"
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_POCKETID_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: KOMGA_POCKETID_CLIENT
