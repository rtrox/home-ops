---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: n8n-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_POSTGRESDB_PASSWORD: "{{ .postgres_password }}"
        # Credentials stored in the database are encrypted with this. Losing
        # it makes every saved credential unreadable, so it lives in Doppler
        # rather than being generated on first boot into the data volume.
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: N8N
