---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: n8n-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_POSTGRESDB_PASSWORD: "{{ .postgres_password }}"
        # Credentials stored in the database are encrypted with this. Losing
        # it makes every saved credential unreadable, so it lives in Doppler
        # rather than being generated on first boot into the data volume.
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: N8N
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: n8n-runners-token
spec:
  length: 48
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-runners
spec:
  # Generated once and then left alone. This token only authenticates the
  # runner sidecar to the broker inside the same pod, so nothing outside the
  # cluster ever needs it and it doesn't belong in Doppler.
  refreshInterval: "0"
  target:
    name: n8n-runners-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        N8N_RUNNERS_AUTH_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: n8n-runners-token
