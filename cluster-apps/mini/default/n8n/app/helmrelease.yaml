---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  chartRef:
    kind: OCIRepository
    name: n8n
  interval: 30m
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.47.2@sha256:83ec9349e09a8efdb51f7e2729f1f83503c038475747a351772ff6b78838f02a
            env:
              TZ: America/Los_Angeles
              GENERIC_TIMEZONE: America/Los_Angeles
              N8N_PORT: &port "5678"
              N8N_HOST: n8n.rtrox.io
              N8N_PROTOCOL: https
              # envoy-internal terminates TLS and sits one proxy hop in front.
              N8N_PROXY_HOPS: "1"
              # Webhook and OAuth-callback URLs n8n shows in the UI and hands
              # to third parties.
              WEBHOOK_URL: https://n8n.rtrox.io/
              N8N_EDITOR_BASE_URL: https://n8n.rtrox.io
              DB_TYPE: postgresdb
              DB_POSTGRESDB_HOST: postgres17-rw.database.svc.cluster.local
              DB_POSTGRESDB_PORT: "5432"
              DB_POSTGRESDB_DATABASE: n8n
              DB_POSTGRESDB_USER: n8n
              # Keep execution history from growing without bound (hours).
              EXECUTIONS_DATA_PRUNE: "true"
              EXECUTIONS_DATA_MAX_AGE: "336"
              # Opt out of anonymous telemetry and the update-check ping.
              N8N_DIAGNOSTICS_ENABLED: "false"
              N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
              # fsGroup owns the volume; n8n's 0600 check fights with it.
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
              N8N_LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: n8n-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - n8n.rtrox.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: n8n
        globalMounts:
          - path: /home/node/.n8n
