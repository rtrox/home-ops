---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-vanilla-rcon-30m-warning
spec:
  schedule: "30 9 * * 1"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rcon
              image: ghcr.io/itzg/minecraft-server:java21@sha256:49544c0a15ede66914451b3c6cb880cb0bd2470b2bfa6f39794f14da02cca79a
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - 'rcon-cli --host minecraft-vanilla-minecraft-rcon --port "25575" --password $$RCON_PASSWORD say "The server will restart in 30 minutes"'
              envFrom:
                - secretRef:
                    name: minecraft
          restartPolicy: OnFailure
