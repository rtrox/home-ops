---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-vanilla-rcon-30m-warning
spec:
  schedule: "30 9 * * 1"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rcon
              image: ghcr.io/itzg/minecraft-server:java21@sha256:f6d0b91029e73afd765ae8b0689cdac754067f3e36cb2d60608366f82d650008
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - 'rcon-cli --host minecraft-vanilla-minecraft-rcon --port "25575" --password $$RCON_PASSWORD say "The server will restart in 30 minutes"'
              envFrom:
                - secretRef:
                    name: minecraft
          restartPolicy: OnFailure
