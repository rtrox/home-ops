---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-offsite
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cnpg-offsite-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # rclone remotes are configured purely through env vars, so no config
        # file with credentials is ever rendered.
        # The Doppler provider ignores remoteRef.property, so each Doppler
        # secret is fetched whole below and unpacked here with fromJson; only
        # the fields the job needs end up in this Secret.
        # Source: the CNPG backup bucket on MinIO (endpoint has no scheme).
        RCLONE_CONFIG_MINIO_TYPE: s3
        RCLONE_CONFIG_MINIO_PROVIDER: Minio
        RCLONE_CONFIG_MINIO_ENDPOINT: "http://{{ (.minio_json | fromJson).endpoint }}"
        RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: "{{ (.minio_json | fromJson).application_key_id }}"
        RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: "{{ (.minio_json | fromJson).application_key }}"
        RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: "true"
        SRC_BUCKET: "{{ (.minio_json | fromJson).bucket }}"
        # Destination: Backblaze B2 via the native b2 backend (the S3
        # endpoint in the Doppler secret is deliberately unused).
        RCLONE_CONFIG_OFFSITE_TYPE: b2
        RCLONE_CONFIG_OFFSITE_ACCOUNT: "{{ (.offsite_json | fromJson).application_key_id }}"
        RCLONE_CONFIG_OFFSITE_KEY: "{{ (.offsite_json | fromJson).application_key }}"
        DST_BUCKET: "{{ (.offsite_json | fromJson).bucket }}"
        HC_PING_URL: "{{ (.hc_json | fromJson).cnpg_offsite_ping_url }}"
  data:
    - secretKey: minio_json
      remoteRef:
        key: CNPG_MINIO_BUCKET
    - secretKey: offsite_json
      remoteRef:
        key: CNPG_OFFSITE_BACKBLAZE_BUCKET
    - secretKey: hc_json
      remoteRef:
        key: HEALTHCHECKS
