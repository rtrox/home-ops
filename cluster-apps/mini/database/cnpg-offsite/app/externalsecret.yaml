---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-offsite
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cnpg-offsite-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # rclone remotes are configured purely through env vars, so no config
        # file with credentials is ever rendered.
        # Source: the CNPG backup bucket on MinIO (endpoint has no scheme).
        RCLONE_CONFIG_MINIO_TYPE: s3
        RCLONE_CONFIG_MINIO_PROVIDER: Minio
        RCLONE_CONFIG_MINIO_ENDPOINT: "http://{{ .src_endpoint }}"
        RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: "{{ .src_key_id }}"
        RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: "{{ .src_key }}"
        RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: "true"
        SRC_BUCKET: "{{ .src_bucket }}"
        # Destination: Backblaze B2 via the native b2 backend (the S3
        # endpoint in the Doppler secret is deliberately unused).
        RCLONE_CONFIG_OFFSITE_TYPE: b2
        RCLONE_CONFIG_OFFSITE_ACCOUNT: "{{ .dst_key_id }}"
        RCLONE_CONFIG_OFFSITE_KEY: "{{ .dst_key }}"
        DST_BUCKET: "{{ .dst_bucket }}"
        HC_PING_URL: "{{ .ping_url }}"
  data:
    - secretKey: src_endpoint
      remoteRef: { key: CNPG_MINIO_BUCKET, property: endpoint }
    - secretKey: src_bucket
      remoteRef: { key: CNPG_MINIO_BUCKET, property: bucket }
    - secretKey: src_key_id
      remoteRef: { key: CNPG_MINIO_BUCKET, property: application_key_id }
    - secretKey: src_key
      remoteRef: { key: CNPG_MINIO_BUCKET, property: application_key }
    - secretKey: dst_bucket
      remoteRef: { key: CNPG_OFFSITE_BACKBLAZE_BUCKET, property: bucket }
    - secretKey: dst_key_id
      remoteRef:
        { key: CNPG_OFFSITE_BACKBLAZE_BUCKET, property: application_key_id }
    - secretKey: dst_key
      remoteRef:
        { key: CNPG_OFFSITE_BACKBLAZE_BUCKET, property: application_key }
    - secretKey: ping_url
      remoteRef: { key: HEALTHCHECKS, property: cnpg_offsite_ping_url }
