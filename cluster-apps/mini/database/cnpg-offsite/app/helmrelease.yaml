---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-offsite
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cnpg-offsite
  values:
    defaultPodOptions:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cnpg-offsite:
        type: cronjob
        cronjob:
          schedule: "0 2 * * *"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          backoffLimit: 1
          # The initial seed can be slow; a normal night takes minutes.
          activeDeadlineSeconds: 7200
          ttlSecondsAfterFinished: 86400
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            # The image's entrypoint is rclone; run the wrapper script instead.
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -u
                ping() { wget -q -O /dev/null -T 15 -t 3 "$HC_PING_URL$1" || true; }
                die() { echo "FAILED: $1" >&2; ping /fail; exit 1; }
                count() {
                  out=$(rclone size --json --fast-list "OFFSITE:$DST_BUCKET") || return 1
                  echo "$out" | sed -n 's/.*"count":\([0-9]*\).*/\1/p'
                }

                ping /start

                before=$(count) || die "could not count destination objects before sync"
                [ -n "$before" ] || die "empty destination count before sync"
                echo "destination objects before: $before"

                # Sync follows Barman's retention. --max-delete is ~3x the
                # average and ~2x the peak daily prune (about one day of WAL
                # plus one base backup); rclone aborts (exit 8) beyond it.
                # No --b2-hard-delete: a deletion only hides the file version,
                # and the bucket's Object Lock keeps it recoverable.
                rclone sync "MINIO:$SRC_BUCKET" "OFFSITE:$DST_BUCKET" \
                  --fast-list --transfers 8 --checkers 16 --max-delete 300 \
                  --stats-one-line --stats 60s -v \
                  || die "rclone sync failed"

                after=$(count) || die "could not count destination objects after sync"
                [ -n "$after" ] || die "empty destination count after sync"
                echo "destination objects after: $after"

                # Silent-loss guard: fail if the destination shrank below 80%.
                if [ "$before" -gt 0 ] && [ $((after * 100)) -lt $((before * 80)) ]; then
                  die "destination shrank from $before to $after objects"
                fi

                ping ""
                echo "done"
            env:
              HOME: /tmp
              XDG_CONFIG_HOME: /tmp
              XDG_CACHE_HOME: /tmp
            envFrom:
              - secretRef:
                  name: cnpg-offsite-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
