---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cloudnative-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      # This whole secret is fed through postBuild.substituteFrom in
      # cloudnative-pg-cluster's Kustomization, and Flux's envsubst
      # validates every key in it as a variable name -- so every key
      # here has to be a valid identifier (no hyphens), even the ones
      # (AWS_*, username, password) that are only ever consumed via
      # secretKeyRef and never actually substituted with ${...}.
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .application_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .application_key }}"
        ENDPOINT: "{{ .endpoint }}"
        BUCKET: "{{ .bucket }}"
  dataFrom:
    - extract:
        key: CNPG_ROOT_CREDENTIALS
    - extract:
        key: CNPG_MINIO_BUCKET
