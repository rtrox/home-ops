---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cloudnative-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        aws-access-key-id: "{{ .application_key_id }}"
        aws-secret-access-key: "{{ .application_key }}"
        # Substituted into cluster.yaml via the cloudnative-pg-cluster
        # Kustomization's postBuild.substituteFrom -- keeps the MinIO
        # endpoint/bucket out of git, same as the volsync/thanos buckets.
        ENDPOINT: "{{ .endpoint }}"
        BUCKET: "{{ .bucket }}"
  dataFrom:
    - extract:
        key: CNPG_ROOT_CREDENTIALS
    - extract:
        key: CNPG_MINIO_BUCKET
