---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-postgres-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: n8n-postgres-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG requires managed.roles[].passwordSecret to be a
      # kubernetes.io/basic-auth secret with username/password keys.
      type: kubernetes.io/basic-auth
      data:
        username: n8n
        password: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: N8N
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: n8n
spec:
  name: n8n
  owner: n8n
  cluster:
    name: postgres17
