---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17-bookworm@sha256:f785551be35036d65a0f1ebe71995022d261a829391fc2f14222ca19795d7c20
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: ceph-block
    size: 20Gi
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - { sourceLabels: [cluster], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  # WAL archiving and base backups go through the Barman Cloud plugin, using
  # the ObjectStore in ./objectstore.yaml (bucket, compression, retention).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio
        # Same server name the in-tree backups used, so the existing archive
        # stays readable and the bucket paths don't change.
        serverName: postgres17
  # Per-app roles are added here as new apps need Postgres; each also gets
  # a Database resource (see ./database-<app>.yaml) pointing at this cluster.
  managed:
    roles:
      - name: sure
        ensure: present
        login: true
        passwordSecret:
          name: sure-postgres-role
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-postgres-role
