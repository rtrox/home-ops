---
# TEMPORARY: restore test of the CNPG off-site copy. Delete (revert the PR) once the restore check passes.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-restore-test
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cnpg-restore-test-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The Doppler provider ignores remoteRef.property: fetch the whole key
        # and unpack it with fromJson. Read-only B2 key.
        AWS_ACCESS_KEY_ID: "{{ (.restore_json | fromJson).application_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ (.restore_json | fromJson).application_key }}"
        ENDPOINT: "{{ (.restore_json | fromJson).endpoint }}"
        BUCKET: "{{ (.restore_json | fromJson).bucket }}"
  data:
    - secretKey: restore_json
      remoteRef:
        key: CNPG_OFFSITE_RESTORE_BACKBLAZE_BUCKET
