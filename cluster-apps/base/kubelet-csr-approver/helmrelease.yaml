---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kubelet-csr-approver
  values:
    # Node names in this repo are always "node<NN>" (no domain suffix) --
    # same pattern across every cluster.
    providerRegex: |
      ^(node[0-9]+)$
    bypassDnsResolution: true
    metrics:
      serviceMonitor:
        enabled: true
